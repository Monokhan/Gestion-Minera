/* ═════════ Geomecánica (sistema Q) ═════════ */
const ESR=[['3.5','Labores mineras temporales (3,5)'],['1.6','Labores mineras permanentes, galerías, socavones (1,6)'],['2.0','Piques verticales rectangulares (2,0)'],['2.5','Piques verticales circulares (2,5)'],['1.3','Túneles de acceso y cavernas de almacenamiento (1,3)']];
const QCLASES=[[0.01,'Excepcionalmente mala'],[0.1,'Extremadamente mala'],[1,'Muy mala'],[4,'Mala'],[10,'Regular'],[40,'Buena'],[100,'Muy buena'],[400,'Extremadamente buena'],[Infinity,'Excepcionalmente buena']];
const qClase=q=>QCLASES.find(c=>q<c[0])[1];
function qCalc(m){ const q=(m.rqd/m.jn)*(m.jr/m.ja)*(m.jw/m.srf); const esr=+m.esr||1.6, B=+m.span||P.diseno.ancho;
  const mus=2*esr*Math.pow(q,0.4), L=2+0.15*B/esr; return {q,clase:qClase(q),rmr:9*Math.log(q)+44,de:B/esr,mus,L,B,requiere:B>mus,esr}; }
function ultimoQ(){ const m=[...P.op.mapeos].sort((a,b)=>b.fecha.localeCompare(a.fecha))[0]; if(!m) return null; return Object.assign(qCalc(m),{labor:m.labor,fecha:m.fecha}); }
const MAPEO_F=[{k:'fecha',label:'Fecha',type:'date',def:today_,req:1},{k:'labor',label:'Labor / frente',type:'select',opts:laborOpts,def:'tunel'},
  {k:'rqd',label:'RQD (10–100)',unit:'%',req:1,def:''},{k:'jn',label:'Jn · sets de diaclasas (0,5–20)',req:1},{k:'jr',label:'Jr · rugosidad (0,5–4)',req:1},{k:'ja',label:'Ja · alteración (0,75–20)',req:1},
  {k:'jw',label:'Jw · agua (0,05–1)',req:1,def:1},{k:'srf',label:'SRF · esfuerzos (0,5–400)',req:1,def:1},{k:'esr',label:'Tipo de excavación (ESR)',type:'select',opts:ESR,def:'1.6'},{k:'span',label:'Vano / ancho de la labor',unit:'m',def:()=>P.diseno.ancho},{k:'obs',label:'Observaciones',type:'text'}];
TABV.geomec={
  build(el){
    el.innerHTML=`
    <p class="lead">Clasificación del macizo rocoso con el sistema Q de Barton para cada frente. Con el vano de la labor calcula el vano máximo sin sostenimiento y el largo de perno de referencia.</p>
    <div class="kpis" data-out="kpis"></div>
    <div class="card"><h3>Mapeo geotécnico del frente</h3>${fForm('fMapeo',MAPEO_F,'Registrar mapeo')}
      <p class="formula">Q = (RQD/Jn)·(Jr/Ja)·(Jw/SRF) · RMR ≈ 9·ln Q + 44 · Dimensión equivalente De = vano/ESR · Vano máximo sin soporte = 2·ESR·Q^0,4 · Largo de perno L = 2 + 0,15·B/ESR</p>
      <p class="note">Valores de Jn, Jr, Ja, Jw y SRF según las tablas del manual del sistema Q (NGI). ESR de labores mineras permanentes: 1,6; temporales: 3,5. El resultado es de referencia; el sostenimiento definitivo lo valida un especialista en geomecánica.</p></div>

    const f=el.querySelector('#fMapeo');
    f.onsubmit=e=>{ e.preventDefault(); const d=fRead(f,MAPEO_F); if(!(d.rqd>0&&d.jn>0&&d.jr>0&&d.ja>0&&d.jw>0&&d.srf>0)) return toast('Completa RQD, Jn, Jr, Ja, Jw y SRF con valores mayores que cero.',true); d.esr=+d.esr; P.op.mapeos.push(d); save(); recompute(false); toast(`Mapeo registrado: Q = ${fmt(qCalc(d).q,2)}`); };

      ['Vano máximo sin soporte',fmt(q.mus,1)+' m',`vano actual ${fmt(q.B,1)} m · ESR ${fmt(q.esr,1)}`,q.requiere?'neg':'pos'],['Largo de perno referencial',fmt(q.L,1)+' m','L = 2 + 0,15·B/ESR'],
      ['Dimensión equivalente',fmt(q.de,2),'vano / ESR'],['Requiere sostenimiento',q.requiere?'Sí':'No',q.requiere?'vano mayor al vano máximo':'dentro del vano autosoportante',q.requiere?'neg':'pos']
    ]):'<div class="kpi"><span>Sin mapeos</span><b>—</b><small>Registra el primer mapeo del frente</small></div>';
    el.querySelector('[data-out=tabla]').innerHTML=tTable(rowsOf(P.op.mapeos),[
      {l:'Fecha',f:r=>esc(r.fecha)},{l:'Labor',f:r=>esc(laborName(r.labor))},{l:'RQD',n:1,f:r=>fmt(r.rqd)},{l:'Jn',n:1,f:r=>fmt(r.jn,2)},{l:'Jr',n:1,f:r=>fmt(r.jr,2)},{l:'Ja',n:1,f:r=>fmt(r.ja,2)},{l:'Jw',n:1,f:r=>fmt(r.jw,2)},{l:'SRF',n:1,f:r=>fmt(r.srf,2)},
      {l:'Q',n:1,f:r=>fmt(qCalc(r).q,3)},{l:'Clase',f:r=>qCalc(r).clase},{l:'Vano máx.',n:1,f:r=>fmt(qCalc(r).mus,1)+' m',cls:r=>qCalc(r).requiere?'neg':''},{l:'Perno',n:1,f:r=>fmt(qCalc(r).L,1)+' m'},{l:'Obs.',f:r=>esc(r.obs||'')}

        mineGroup.add(new THREE.Mesh(g,mMat(MCOL.caseron,.55)));
        const eg=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0xf0a26a,transparent:true,opacity:.8})); mineGroup.add(eg);
        c.forEach(v=>mineBox.expandByPoint(v));
      }
    }
    G.niveles.forEach(l=>{ if(l.xc) addLabel(`SN${l.k+1} · −${fmt(l.z)} m · cota ${fmt(z0-l.z)}`,M(l.xc.a.x,z0-l.z+6,l.xc.a.n),'sta','mine'); });
  }
  if(S.obras) for(const o of (P.obras||[])){
    const zr=+o.z||0, col=MCOL[o.tipo]||MCOL.otro;
    if(o.tipo==='pique'){ const top=elevLocal(o.x,o.n); const A=M(o.x,top!=null?top:z0,o.n), B=M(o.x,(top!=null?top:z0)-(+o.prof||0),o.n); tube(A,B,(+o.diam||2)/2,col); addLabel(o.nombre,A.clone().add(new THREE.Vector3(0,8,0)),'route','mine'); }
    else if(o.tipo==='chimenea'){ const A=M(o.x,z0+zr,o.n),B=M(o.x,z0+zr+(+o.largo||0),o.n); tube(A,B,(+o.diam||2)/2,col); addLabel(o.nombre,B.clone().add(new THREE.Vector3(0,4,0)),'route','mine'); }
    else if(o.tipo==='galeria'){ const a={x:+o.x,n:+o.n,z:zr}, b={x:+o.x+Math.sin((+o.az||0)*D2R)*(+o.largo||0),n:+o.n+Math.cos((+o.az||0)*D2R)*(+o.largo||0),z:zr}; beam(a,b,+o.ancho||4,+o.alto||4,MCOL.galeriaObra); addLabel(o.nombre,M(a.x,z0+zr+(+o.alto||4)+3,a.n),'route','mine'); }
    else { const c=box({x:+o.x,n:+o.n,z:zr},+o.largo||6,+o.ancho||4,+o.alto||3,+o.az||0,o.tipo==='refugio'?MCOL.refugio:col); addLabel(o.nombre,new THREE.Vector3(c.x,c.y+(+o.alto||3)+3,c.z),'point','mine'); }
  }
  if(info) info.textContent=G.ok?`${G.q.niveles} subniveles · ${G.q.caserones} caserones · ${(P.obras||[]).length} obras`:'';
}
function focusMine(){ if(!mineBox||mineBox.isEmpty()) return toast('Primero carga la rampa para ubicar la mina.',true); const b=mineBox.clone(); b.expandByScalar(20); frameBox(b,1.15); S.opacity=.3; $('vXray').value=70; $('vXrayV').textContent='70 %'; applyOpacity(); }


/* Bucle */
const _ld=new THREE.Vector3(),_q=new THREE.Vector3(); let last=performance.now();
function tick(now){
  if(current!=='maqueta'){ running=false; active=false; return; }
  const dt=Math.min(.1,(now-last)/1000); last=now;
  if(inited&&renderer){
    stepTween(now); controls.update(); camera.updateMatrixWorld(); _ld.copy(sunDir).transformDirection(camera.matrixWorldInverse);
    if(terrainMat) terrainMat.uniforms.lightDir.value.copy(_ld); if(blockMat) blockMat.uniforms.lightDir.value.copy(_ld);
    if(marker&&S.animate&&rampLine.length>1){ const cum=rampLine.cum,tot=cum[cum.length-1]; markerS=(markerS+dt*Math.max(18,tot/14))%tot; let i=1; while(i<cum.length-1&&cum[i]<markerS) i++;
      const t=(markerS-cum[i-1])/Math.max(1e-6,cum[i]-cum[i-1]); marker.position.lerpVectors(rampLine[i-1],rampLine[i],t); _q.copy(rampLine[i]); rampGroup.localToWorld(_q); marker.lookAt(_q); }
    renderer.render(scene,camera); updateLabels(); $('vNeedle').setAttribute('transform',`rotate(${(controls.getAzimuthalAngle()/D2R).toFixed(1)})`);
  }
  requestAnimationFrame(tick);
}
function dolly(f){ if(!controls) return; const t=controls.target, v=camera.position.clone().sub(t).multiplyScalar(f); camera.position.copy(t).add(v); }
function orbit(deg){ if(!controls) return; const t=controls.target, v=camera.position.clone().sub(t); v.applyAxisAngle(new THREE.Vector3(0,1,0),deg*D2R); camera.position.copy(t).add(v); }
