<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mina La Suerte · Gestión Minera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: menú lateral fijo + barra superior con la tarifa vigente + área de pestañas; la maqueta 3D ocupa todo el alto de su pestaña */
:root{
  --bg:#0e1214; --bg-2:#141a1d; --card:#151c1f; --card-2:#1a2226; --line:#263034; --line-2:#334047;
  --fg:#ebe6dd; --muted:#8f9c9f; --faint:#5f6c70;
  --copper:#d27a3f; --copper-hi:#f0a26a; --copper-ink:#1d0f06;
  --malachite:#4fb59a; --warn:#e0b23a; --crit:#e0564a; --good:#4fb59a;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav:236px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--copper-hi)}
.app{display:grid;grid-template-columns:var(--nav) 1fr;height:100%}

/* Menú */
.nav{background:#0b0f11;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.nav .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.eyebrow{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--copper-hi)}
.nav h1{font:700 30px/.92 var(--f-display);text-transform:uppercase;margin:6px 0 2px;letter-spacing:.01em}
.nav h1 em{font-style:normal;color:var(--copper)}
.nav .sub{font:400 11px/1.4 var(--f-mono);color:var(--muted)}
.menu{flex:1;overflow-y:auto;padding:10px 8px;display:grid;gap:2px;align-content:start}
.menu .grp{font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:12px 10px 6px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:5px;padding:8px 10px;cursor:pointer;color:var(--muted);font-size:13.5px}
.menu button:hover{color:var(--fg);background:var(--card)}
.menu button[aria-current=page]{color:var(--fg);background:var(--card-2);border-color:var(--line-2)}
.menu button[aria-current=page] .ic{color:var(--copper)}
.menu .ic{width:18px;height:18px;flex:none;color:var(--faint)}
.menu .badge{margin-left:auto;font:500 10px/1 var(--f-mono);background:var(--warn);color:#211800;border-radius:9px;padding:3px 6px}
.nav .foot{border-top:1px solid var(--line);padding:12px;display:grid;gap:6px}
.nav .foot small{font:400 10.5px/1.4 var(--f-mono);color:var(--faint)}

/* Barra superior */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--bg-2);flex-wrap:wrap}
.top h2{font:600 22px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin:0;flex:1;min-width:0}
.chip{display:flex;align-items:center;gap:10px;font:500 11.5px/1.3 var(--f-mono);border:1px solid var(--line-2);border-radius:5px;padding:6px 10px;background:var(--card);white-space:nowrap}
.chip b{color:var(--copper-hi);font-weight:500}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.chip.stale .dot{background:var(--warn)}
#menuBtn{display:none}
.scroll{flex:1;overflow-y:auto;min-height:0}
.tab{padding:20px;display:grid;gap:16px;max-width:1280px}
.tab.full{padding:0;max-width:none;height:100%;position:relative}

/* Componentes */
button.b{background:var(--card-2);border:1px solid var(--line-2);border-radius:5px;padding:7px 12px;cursor:pointer;font-size:13px;line-height:1.2}
button.b:hover{border-color:var(--copper)}
button.b.primary{background:var(--copper);border-color:var(--copper);color:var(--copper-ink);font-weight:600}
button.b.primary:hover{background:var(--copper-hi)}
button.b.ghost{background:none}
button.b.sm{padding:4px 8px;font-size:12px}
button.b.danger:hover{border-color:var(--crit);color:#ffb3aa}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--copper-hi);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.card>h3,.h3{font:600 15px/1.1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card>h3 small,.h3 small{font:400 11px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;align-items:start}
p{margin:0}
.lead{color:var(--muted);max-width:75ch}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.src{font:400 10.5px/1.3 var(--f-mono);color:var(--faint)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px}
.f{display:grid;gap:3px;min-width:0}
.f>span{font-size:12px;color:var(--muted)}
.f .in{display:flex;align-items:center;background:#11171a;border:1px solid var(--line-2);border-radius:4px;min-width:0}
.f .in:focus-within{border-color:var(--copper)}
.f input,.f select{flex:1;min-width:0;background:none;border:none;padding:7px 8px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.f select{font-family:var(--f-body)}
.f select option{background:#11171a}
.f em{font-style:normal;font:400 11px var(--f-mono);color:var(--faint);padding-right:8px;white-space:nowrap}
.f input:disabled{color:var(--muted)}
.tog{display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer;line-height:1.35}
.tog input{accent-color:var(--copper);margin:2px 0 0;width:15px;height:15px;flex:none}
.tog small{display:block;color:var(--muted);font-size:11.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));background:var(--card);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.kpi{background:var(--card);padding:12px 14px;display:grid;gap:2px;min-width:0;align-content:start;box-shadow:inset -1px -1px 0 var(--line)}
.kpi span{font:400 10.5px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi b{font:600 26px/1.1 var(--f-display);letter-spacing:.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{font:400 11px/1.35 var(--f-mono);color:var(--faint)}
.kpi.neg b{color:#ff9d8f}.kpi.pos b{color:#8fdcc4}.kpi.acc b{color:var(--copper-hi)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#12181b;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.tot td{font-weight:600;background:#12181b}
tr.sub td{color:var(--muted)}
td input{width:100%;min-width:70px;background:#11171a;border:1px solid var(--line-2);border-radius:3px;padding:4px 6px;font-family:var(--f-mono);font-size:12.5px;text-align:right}
td input[type=text]{text-align:left;font-family:var(--f-body);min-width:240px}
td input[type=checkbox]{width:auto;min-width:0;accent-color:var(--copper)}
.neg{color:#ff9d8f}.pos{color:#8fdcc4}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 10.5px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:10px;border:1px solid var(--line-2);white-space:nowrap}
.pill.ok{color:#8fdcc4;border-color:rgba(79,181,154,.45)}
.pill.warn{color:var(--warn);border-color:rgba(224,178,58,.45)}
.pill.crit{color:#ff9d8f;border-color:rgba(224,86,74,.5)}
.pill.info{color:var(--copper-hi);border-color:rgba(210,122,63,.45)}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:5px;background:var(--card-2);font-size:13px}
.alert.crit{border-left-color:var(--crit)}.alert.info{border-left-color:var(--copper)}.alert.ok{border-left-color:var(--good)}
.alert b{font-weight:600}
.alert .ac{grid-column:2;color:var(--muted);font-size:12px}
.drop{border:1.5px dashed var(--line-2);border-radius:7px;padding:22px;display:grid;gap:8px;place-items:center;text-align:center;cursor:pointer;background:#11171a}
.drop:hover,.drop.on{border-color:var(--copper);background:#1a1511}
.drop b{font:600 18px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.checks{display:grid;gap:4px;font-size:13px}
.checks div{display:flex;gap:8px;align-items:baseline}
.checks i{font-style:normal;font-weight:700;width:14px;flex:none}
.checks .y i{color:var(--good)}.checks .x i{color:var(--crit)}
.checks small{color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-left:auto;text-align:right}
.formula{font:400 11.5px/1.4 var(--f-mono);color:var(--muted)}
.chart{position:relative;min-height:220px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:#0b0f11;border:1px solid var(--line-2);border-radius:4px;padding:6px 8px;font:500 11.5px/1.4 var(--f-mono);white-space:nowrap;z-index:2;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
details{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:#12181b}
details summary{cursor:pointer;font-size:13px;color:var(--fg)}
details[open] summary{margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.modal{position:fixed;inset:0;background:rgba(5,8,9,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--card);border:1px solid var(--line-2);border-radius:9px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:grid;gap:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0b0f11;border:1px solid var(--copper);padding:9px 14px;border-radius:5px;z-index:60;max-width:calc(100vw - 32px);font-size:13px}
.toast.err{border-color:var(--crit)}
.dropall{position:fixed;inset:10px;border:2px dashed var(--copper);border-radius:10px;background:rgba(14,18,20,.8);display:grid;place-items:center;z-index:70;pointer-events:none;font:600 24px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--copper-hi);text-align:center;padding:20px}

/* Maqueta 3D */
#v3d{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 30% 10%,#1a2023,#0e1214 70%)}
#v3d canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#vLabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:500 11px/1.2 var(--f-mono);color:var(--fg);padding:3px 6px;background:rgba(9,13,15,.8);border:1px solid var(--line);border-radius:3px;will-change:transform;font-variant-numeric:tabular-nums}
.lbl.point{border-color:var(--malachite)}.lbl.route{border-color:rgba(79,181,154,.6)}.lbl.poly{border-color:var(--warn)}
.lbl.sta{color:var(--copper-hi);border-color:rgba(210,122,63,.6);font-size:10px}
.lbl.key{background:var(--copper);color:var(--copper-ink);border-color:var(--copper);font-weight:600}
.lbl.tick{background:none;border:none;color:var(--muted);font-size:10px;padding:0}
#vPanel{position:absolute;top:12px;right:12px;bottom:12px;width:320px;overflow-y:auto;background:rgba(15,20,23,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:7px}
#vPanel section{padding:12px 14px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
#vPanel section:last-child{border-bottom:none}
#vPanel h4{font:600 14px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#vPanel h4 small{font:400 10.5px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--muted)}
.rng{display:grid;gap:2px}
.rng .row{justify-content:space-between;font-size:12px;color:var(--muted)}
.rng .v{font:500 12px var(--f-mono);color:var(--copper-hi)}
.rng input{width:100%;accent-color:var(--copper);margin:2px 0}
.rng input:disabled{opacity:.35}
.b2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vstats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.vstats div{background:#12181b;padding:7px 9px;min-width:0}
.vstats b{display:block;font:600 19px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.vstats span{font:400 9.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vstats .warn b{color:var(--warn)}.vstats .wide{grid-column:1/-1}
.featlist{display:grid;gap:1px;max-height:150px;overflow:auto}
.feat{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.feat input{accent-color:var(--copper);margin:0}
.feat .sw{width:12px;height:3px;border-radius:2px;flex:none}.feat .sw.pt{width:8px;height:8px;border-radius:50%}
.feat button{background:none;border:none;padding:2px 0;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.feat button:hover{color:var(--copper-hi)}
.feat .k{font:400 10px var(--f-mono);color:var(--muted);text-transform:uppercase}
#vHud{position:absolute;left:14px;bottom:14px;display:flex;align-items:flex-end;gap:10px;pointer-events:none}
#vReadout{font:500 11px/1.5 var(--f-mono);background:rgba(15,20,23,.92);border:1px solid var(--line);border-radius:4px;padding:5px 9px;font-variant-numeric:tabular-nums}
#vStatus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 40px));background:rgba(15,20,23,.95);border:1px solid var(--line);border-radius:7px;padding:16px 18px;display:grid;gap:10px}
#vStatus .t{font:600 16px/1.1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
#vStatus .m{font:400 12px/1.5 var(--f-mono);color:var(--muted)}
#vStatus .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
#vStatus .bar i{display:block;height:100%;width:0;background:var(--copper);transition:width .2s}
#vPanelBtn{display:none;position:absolute;right:12px;top:12px;z-index:3}
.present .nav,.present .top,.present #vPanel,.present #vHud,.present #vPanelBtn{display:none!important}
.present .app{grid-template-columns:1fr}
#vExit{position:absolute;right:14px;top:14px;z-index:4}

.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;counter-reset:ph}
.flow .arrow{display:none}
.phase{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--line-2);border-radius:7px;padding:12px 14px;display:grid;gap:10px;align-content:start;min-width:0}
.phase.curso{border-top-color:var(--warn)}.phase.ok{border-top-color:var(--good)}
.ph-head{display:flex;align-items:center;gap:8px}.ph-head b{font:600 15px/1.1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;flex:1}
.ph-n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line-2);font:600 11px var(--f-mono)}
.phase.ok .ph-n{background:var(--good);color:#06221a;border-color:var(--good)}.phase.curso .ph-n{border-color:var(--warn);color:var(--warn)}
.ph-p{font:500 11px var(--f-mono);color:var(--muted)}
.ph-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.ph-bar i{display:block;height:100%;background:var(--good)}
.phase ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.h{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:13px;align-items:start}
.h small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.hbtn{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);background:var(--card-2);cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center;padding:0}
.hbtn:disabled{cursor:default}
.h.ok .hbtn{background:var(--good);border-color:var(--good);color:#06221a}.h.curso .hbtn{border-color:var(--warn);color:var(--warn)}
.h.ok>div>span{color:var(--muted)}
.hdate{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-top:4px}
.hdate input{background:#11171a;border:1px solid var(--line-2);border-radius:3px;padding:2px 4px;font:400 11px var(--f-mono)}
.chev{display:flex;gap:3px;overflow-x:auto;padding-bottom:2px}
.chev div{flex:1 0 120px;min-width:120px;padding:9px 18px 9px 22px;background:var(--card-2);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);font:600 12px/1.15 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chev div:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.chev div.ok{background:#1d3b33;color:#8fdcc4}.chev div.curso{background:#3a3016;color:var(--warn)}
.chev small{display:block;font:400 10px var(--f-mono);letter-spacing:0;text-transform:none;margin-top:2px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .nav{position:fixed;inset:0 auto 0 0;width:min(280px,86vw);z-index:40;transform:translateX(-102%);transition:transform .2s}
  .nav.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  #menuBtn{display:inline-block}
  .top{padding:10px 16px}
  .chip{white-space:normal;flex-wrap:wrap;gap:4px 8px;font-size:11px}
  .tab{padding:16px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  #vPanel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:60%;border-radius:10px 10px 0 0;transform:translateY(105%);transition:transform .25s}
  #vPanel.open{transform:none}
  #vPanelBtn{display:block}
  #vReadout{display:none}
}
@media (prefers-reduced-motion:reduce){.nav,#vPanel{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="nav" id="nav" aria-label="Menú principal">
    <div class="brand">
      <div class="eyebrow">Distrito El Algarrobo · Atacama</div>
      <h1>Mina La Suerte <em>1/6</em></h1>
      <div class="sub">Minería subterránea de cobre · ENAMI</div>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="foot">
      <div class="row"><button class="b sm" id="btnExport" type="button">Exportar respaldo</button><button class="b sm" id="btnImport" type="button">Importar</button></div>
      <small id="saveState">Los datos se guardan en este navegador.</small>
    </div>
  </aside>
  <main>
    <div class="top">
      <button class="b sm" id="menuBtn" type="button" aria-controls="nav" aria-expanded="false">Menú</button>

<script>
/* Lector de la circular mensual de tarifas ENAMI (PDF) — compartido entre la app y las pruebas */
(function(root){
'use strict';
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const nrm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const NUM_RE=/(?<![\w.,])(?:\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:,\d+)?)(?![\w])/g;
function num(s){ return parseFloat(String(s).replace(/\./g,'').replace(',','.')); }
function nums(s){ return (String(s).match(NUM_RE)||[]).map(num); }

/* Agrupa los fragmentos de texto de pdf.js en filas (misma altura) */
function rowsFromItems(items){
  const rows=[];
  for(const it of items){
    const str=(it.str||'').replace(/ /g,' '); if(!str.trim()) continue;
    const x=it.transform[4], y=it.transform[5];
    let r=rows.find(r=>Math.abs(r.y-y)<2.6);
    if(!r){ r={y,items:[]}; rows.push(r); }
    r.items.push({x,w:it.width||0,str:str.trim()});
  }
  rows.sort((a,b)=>b.y-a.y);
  for(const r of rows){ r.items.sort((a,b)=>a.x-b.x); r.text=r.items.map(i=>i.str).join(' ').replace(/\s+/g,' '); r.n=nrm(r.text); }
  return rows;
}

function after(rowN, label){
  // búsqueda tolerante a espacios partidos por el PDF (p. ej. "P lantas")
  const L=label.replace(/\s+/g,''); let map=[], s='';
  for(let i=0;i<rowN.length;i++){ if(rowN[i]!==' '){ s+=rowN[i]; map.push(i); } }
  const k=s.indexOf(L); if(k<0) return null;
  return rowN.slice(map[k+L.length-1]+1);
}
function pick(vals, keys){ const o={}; keys.forEach((k,i)=>{ if(vals[i]!=null&&isFinite(vals[i])) o[k]=vals[i]; }); return o; }
const CU5=['base','escala','cobranza','otorgamiento','credito'];

function parseTarifaPage(rows, out){
  let sec='';
  for(let i=0;i<rows.length;i++){
    const r=rows[i], n=r.n;
    let m;
    if((m=n.match(/mes de\s*-?\s*(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s+de\s+(\d{4})/))){ out.mes=m[1]; out.anio=+m[2]; }
    if(n.startsWith('minerales de flotacion')) sec='flot';
    else if(n.startsWith('minerales de lixiviacion')) sec='lix';
    else if(n.startsWith('subproductos')) sec='sub';
    else if(n.startsWith('minerales de fundicion directa')) sec='fund';
    else if(n.startsWith('concentrados')) sec='conc';
    else if(n.startsWith('precipitados')) sec='prec';
    else if(n.startsWith('oro metalico')) sec='orom';
    let t;
    if(sec==='flot'){
      if((t=after(n,'tarifas nacionales excepto indicadas'))!=null){ const v=nums(t); out.flot.nacional=Object.assign(pick(v,CU5),{au:pick(v.slice(5,7),['base','escala']), ag:pick(v.slice(7,9),['base','escala'])}); }
      else if((t=after(n,'tarifa cobre agencia matta'))!=null) out.flot.matta=pick(nums(t),CU5);
      else if((t=after(n,'tarifa ganga caliza'))!=null){ out.flot.cabildo=pick(nums(t.replace(/^[a-z\s-]+/,'')),CU5); }
      else if((t=after(n,'tarifa equivalente'))!=null){ const v=nums(t); out.flot.equivalente=Object.assign(pick(v,CU5),{au:pick(v.slice(5,7),['base','escala'])}); }
    }
    if(sec==='lix'){
      if((t=after(n,'tarifas nacionales oxidos'))!=null){ out.lix.nacional=pick(nums(t.replace(/^\s*\(sxew\)/,'')),CU5); }
      else if((t=after(n,'tarifas sxew plantas enami'))!=null) out.lix.sxew=pick(nums(t),CU5);
      else if(n.startsWith('ajuste por acido')){
        const k=n.includes('plantas enami')?'sxew':'nacional'; const v=nums(n.split('consumo base de')[1]||'');
        out.lix.acido=out.lix.acido||{}; out.lix.acido[k]={consumoBase:v[0], ajuste:v[v.length-1]};
      }
    }
    if(sec==='sub'){
      if(/^cobre\s*:?\s*1% cu insoluble/.test(n)) out.sub.cu=nums(n.replace(/^cobre\s*:?\s*1% cu insoluble/,'')).pop();
      else if(/^oro\s*:?\s*1 gr\/ton/.test(n)) out.sub.au=nums(n.replace(/^oro\s*:?\s*1 gr\/ton/,'')).pop();
      else if(/^plata\s*:?\s*1 gr\/ton/.test(n)) out.sub.ag=nums(n.replace(/^plata\s*:?\s*1 gr\/ton/,'')).pop();
    }
    if(sec==='fund'||sec==='conc'||sec==='prec'){
      const tgt=out[sec]=out[sec]||{};
      if((m=n.match(/^cobre\s*:\s*base\s*([\d.,]+)\s*%(.*)$/))){ tgt.cu=Object.assign({leyBase:num(m[1])},pick(nums(m[2]),CU5)); }
      else if((m=n.match(/^oro\s*:\s*base\s*([\d.,]+)\s*gr au\/tms(.*)$/))){ tgt.au=Object.assign({leyBase:num(m[1])},pick(nums(m[2]),['base','escala'])); }
      else if((m=n.match(/^plata\s*:\s*base\s*([\d.,]+)\s*gr ag\/tms(.*)$/))){ tgt.ag=Object.assign({leyBase:num(m[1])},pick(nums(m[2]),['base','escala'])); }
    }
    if(sec==='orom' && (t=after(n,'precio del gramo de oro fino'))!=null) out.oroMetal=nums(t)[0];
    if(/devolucion de un monto equivalente/.test(n)) out.devolucionCobranza=true;
  }
}

function parseCircular(rows, out){
  const all=rows.map(r=>r.n).join('\n');
  let m;
  if((m=all.match(/circular n\S*\s*(\d+)/))) out.circular=m[1];
  if((m=all.match(/tipo de cambio aplicado[^\n]*?([\d.]+,\d+)\s*\$\/us\$/))) out.tc=num(m[1]);
  if((m=all.match(/retencion de impuesto articulo 23[^\n]*?([\d,]+)\s*%/))) out.retencion=num(m[1]);
  if((m=all.match(/cobre\s+([\d.,]+)\s*[¢c]?\s*us\$\/lb/))) out.precios.cu=num(m[1]);
  if((m=all.match(/plata\s+([\d.,]+)\s*us\$\/oz/))) out.precios.ag=num(m[1]);
  if((m=all.match(/oro\s+([\d.,]+)\s*us\$\/oz/))) out.precios.au=num(m[1]);
  if((m=all.match(/tarifa de concentracion debe descontarsele\s*([\d,]+)\s*gr\s*au/))) out.notas.auDescConc=num(m[1]);
  if((m=all.match(/tarifa de fundicion debe descontarsele\s*([\d,]+)\s*gr\s*au/))) out.notas.auDescFund=num(m[1]);
  if((m=all.match(/concentracion debera descontarsele\s*([\d,]+)\s*grs?\s*ag/))) out.notas.agDescConc=num(m[1]);
  if((m=all.match(/iguales o superiores a\s*([\d,]+)\s*grs?\s*ag/))) out.notas.agMin=num(m[1]);
  if((m=all.match(/subproducto cobre en productos a fundicion se le descontara\s*([\d,]+)\s*%/))) out.notas.cuDescFund=num(m[1]);
}

function parseCastigos(rows, out){
  // Columnas por posición: "0,10%", "1%", "10 ppm"
  let cols=null, sec=null; const res={min:[],fund:[],hum:[]};
  for(const r of rows){
    const n=r.n;
    if(!cols && r.items.some(i=>/^0,10%$/.test(i.str))){
      cols={};
      for(const it of r.items){ if(it.str==='0,10%') cols.p01=it.x; else if(it.str==='1%') cols.p1=it.x; else if(/^10 ?ppm$/i.test(it.str)) cols.ppm=it.x; }
      continue;
    }
    if(/^i minerales/.test(n)) { sec='min'; continue; }
    if(/^ii minerales/.test(n)) { sec='fund'; continue; }
    if(/^iii contenido de humedad/.test(n)) { sec='hum'; continue; }
    if(!sec||!cols) continue;
    const m=n.match(/^([a-z]+)\s+([\d.,]+\s*(?:%|ppm))\s+([\d.,]+\s*(?:%|ppm))\s+\$?\s*([\d.,]+)/);
    if(!m) continue;
    // ubicar la columna del castigo por la posición x del último número
    const lastItem=[...r.items].reverse().find(i=>/\d/.test(i.str));
    const x=lastItem?lastItem.x:0;
    let per='p01', best=Infinity;
    for(const [k,cx] of Object.entries(cols)){ const d=Math.abs(cx-x); if(d<best){best=d;per=k;} }
    const unit=/ppm/.test(m[2])?'ppm':'%';
    res[sec].push({el:m[1], tol:num(m[2]), max:num(m[3]), unit, per:{p01:0.1,p1:1,ppm:10}[per], monto:num(m[4])});
  }
  out.castigos=res;
}

function parseServicios(rows, out){
  const s={ensayes:[]};
  for(const r of rows){
    const n=r.n; let t, m;
    if((t=after(n,'pesada en horario normal de trabajo de la agencia'))!=null) s.pesada=nums(t)[0];
    else if((t=after(n,'descarga a cancha o tolva'))!=null) s.descarga=nums(t)[0];
    else if((t=after(n,'levante de lotes'))!=null) s.levante=nums(t).slice(0,2);
    else if((t=after(n,'muestreo de lotes'))!=null && !n.includes('remuestreo')) s.muestreo=nums(t).slice(0,2);
    else if((m=n.match(/^c\)\s*remuestreo\s+([\d.,]+)/))) s.remuestreo=num(m[1]);
    else if((m=r.text.match(/^(\d{1,2})\s+(.+?)\s+([A-ZÁÉÍÓÚ][a-záéíóúñ]+(?: [a-záéíóúñ]+)*)\s+([\d.]+)$/))) s.ensayes.push({cod:+m[1], sim:m[2].replace(/\s+/g,''), desc:m[3].trim(), valor:num(m[4])});
  }
  out.serv=s;
}

/* pages: array de arrays de filas (una por página) */
function parseTarifaENAMI(pages){
  const out={flot:{},lix:{},sub:{},precios:{},notas:{},usd:{flot:{},lix:{},sub:{}},devolucionCobranza:false};
  for(const rows of pages){
    const all=rows.map(r=>r.n).join(' ');
    if(/tarifas de compra - valores en us\$/.test(all)){ const tmp={flot:{},lix:{},sub:{}}; parseTarifaPage(rows,tmp); out.usd=tmp; }
    else if(/tarifas de compra - valores en \$/.test(all)) parseTarifaPage(rows,out);
    else if(/circular n/.test(all)) parseCircular(rows,out);
    else if(/castigos por impurezas/.test(all) && !/valores en us\$/.test(all) && !out.castigos) parseCastigos(rows,out);
    else if(/tarifas de servicios/.test(all) && /\$\/camion/.test(all) && !/us\$\/camion/.test(all)) parseServicios(rows,out);
  }
  if(out.mes) out.id=`${out.anio}-${String(MESES.indexOf(out.mes)+1).padStart(2,'0')}`;
  out.checks=validate(out);
  return out;
}

function validate(t){
  const c=[]; const ok=(name,cond,detail)=>c.push({name,ok:!!cond,detail:detail||''});
  ok('Mes y año de la circular', t.id, t.id?`${t.mes} ${t.anio}`:'no encontrado');
  ok('Tipo de cambio', t.tc>0, t.tc?`${t.tc} $/US$`:'no encontrado');
  const fn=t.flot.nacional||{};
  ok('Tarifa flotación nacional (base, escala)', fn.base>0&&fn.escala>0, fn.base?`${fn.base} / ${fn.escala}`:'no encontrada');
  ok('Tarifa agencia Matta', t.flot.matta&&t.flot.matta.base>0, t.flot.matta?`${t.flot.matta.base} / ${t.flot.matta.escala}`:'no encontrada');
  ok('Tarifa óxidos nacional', t.lix.nacional&&t.lix.nacional.base>0, t.lix.nacional?`${t.lix.nacional.base} / ${t.lix.nacional.escala}`:'no encontrada');
  ok('Precio del cobre', t.precios.cu>0, t.precios.cu?`${t.precios.cu} ¢US$/lb`:'no encontrado');
  ok('Retención Art. 23', t.retencion>0, t.retencion?`${t.retencion} %`:'no encontrada');
  ok('Castigos por impurezas', t.castigos&&t.castigos.min.length>0, t.castigos?`${t.castigos.min.length} minerales · ${t.castigos.fund.length} fundición · ${t.castigos.hum.length} humedad`:'no encontrados');
  ok('Tarifas de servicios', t.serv&&t.serv.pesada>0, t.serv?`pesada ${t.serv.pesada} $/camión`:'no encontradas');
  // Coherencia pesos vs dólares
  const u=(t.usd&&t.usd.flot&&t.usd.flot.nacional)||{};
  if(fn.base&&u.base&&t.tc){
    const d=Math.abs(u.base*t.tc-fn.base)/fn.base*100, e=Math.abs(u.escala*t.tc-fn.escala)/fn.escala*100;
    ok('Coherencia $ ↔ US$ × tipo de cambio', d<0.3&&e<0.3, `base ${d.toFixed(2)} % · escala ${e.toFixed(2)} % de diferencia`);
  } else ok('Coherencia $ ↔ US$ × tipo de cambio', false, 'no se pudo comparar');
  return c;
}

root.ENAMIParser={rowsFromItems, parseTarifaENAMI, nums, num};
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
/* Generador conceptual de mina subterránea por Sublevel Stoping (SLS) — coordenadas locales:
   x = este (m), n = norte (m), z = cota relativa al portal de la rampa (m, negativa hacia abajo) */
(function(root){
'use strict';
const D2R=Math.PI/180;
const add=(a,b,k=1)=>({x:a.x+b.x*k,n:a.n+b.n*k});
const dist=(a,b)=>Math.hypot(a.x-b.x,a.n-b.n);

function rampLine(path,grade){
  const pts=[]; let s=0;
  for(let i=0;i<path.length;i++){ if(i) s+=dist(path[i],path[i-1]); pts.push({x:path[i].x,n:path[i].n,s,z:-grade*s}); }
  return pts;
}
function pointAtS(pts,s){
  if(s<=0) return {...pts[0]}; const L=pts[pts.length-1].s; if(s>=L) return {...pts[pts.length-1]};
  let i=1; while(i<pts.length-1&&pts[i].s<s) i++;
  const a=pts[i-1],b=pts[i],t=(s-a.s)/Math.max(1e-9,b.s-a.s);
  return {x:a.x+(b.x-a.x)*t,n:a.n+(b.n-a.n)*t,s,z:a.z+(b.z-a.z)*t};
}
/* Geometría automática del cuerpo (solo si el usuario no la define): eje principal de la rampa */
function autoOrebody(path){
  const n=path.length; let mx=0,mn=0; path.forEach(p=>{mx+=p.x;mn+=p.n;}); mx/=n; mn/=n;
  let sxx=0,snn=0,sxn=0; path.forEach(p=>{sxx+=(p.x-mx)**2;snn+=(p.n-mn)**2;sxn+=(p.x-mx)*(p.n-mn);});
  const ang=0.5*Math.atan2(2*sxn,sxx-snn);           // ángulo desde el eje x (este)
  let az=(90-ang/D2R+360)%180;                        // rumbo 0–180°
  const u={x:Math.sin(az*D2R),n:Math.cos(az*D2R)}, v={x:Math.cos(az*D2R),n:-Math.sin(az*D2R)};
  let minV=Infinity,minU=Infinity,maxU=-Infinity;
  path.forEach(p=>{ const dv=(p.x-mx)*v.x+(p.n-mn)*v.n, du=(p.x-mx)*u.x+(p.n-mn)*u.n; minV=Math.min(minV,dv); minU=Math.min(minU,du); maxU=Math.max(maxU,du); });
  return {rumbo:+az.toFixed(1), cx:+(mx+v.x*(minV-40)).toFixed(1), cn:+(mn+v.n*(minV-40)).toFixed(1), largoRampa:maxU-minU};
}

function generate(p,path,grade){
  const W=[], el=[], obras=[];
  if(!path||path.length<2) return {ok:false,warn:['No hay ruta de rampa cargada.'],el,obras,niveles:[],caserones:[],q:{}};
  const R=rampLine(path,grade), Lr=R[R.length-1].s, zRampa=grade*Lr;
  const auto=autoOrebody(path);
  const rumbo=p.rumbo!=null?p.rumbo:auto.rumbo;
  const C={x:p.cx!=null?p.cx:auto.cx, n:p.cn!=null?p.cn:auto.cn};
  const u={x:Math.sin(rumbo*D2R),n:Math.cos(rumbo*D2R)};          // dirección del rumbo
  const vR={x:Math.cos(rumbo*D2R),n:-Math.sin(rumbo*D2R)};         // perpendicular (rumbo + 90°)
  // el cuerpo inclina alejándose de la rampa (rampa en la caja yacente)
  let mx=0,mn=0; path.forEach(q=>{mx+=q.x;mn+=q.n;}); mx/=path.length; mn/=path.length;
  const side=((C.x-mx)*vR.x+(C.n-mn)*vR.n)>=0?1:-1;
  const dipDir=p.buzHacia==='rampa'?{x:-vR.x*side,n:-vR.n*side}:{x:vR.x*side,n:vR.n*side};
  const dip=Math.max(45,Math.min(90,p.manteo)), tanD=Math.tan(dip*D2R), sinD=Math.sin(dip*D2R);
  const Wh=p.potencia/sinD;                                        // ancho horizontal
  const Ls=p.largo, half=Ls/2, dz=p.subnivel;
  const zTop=p.techo, zBotMax=p.fondo!=null?p.fondo:Math.floor(zRampa-p.margenFondo);
  if(dip<50) W.push('Con manteo bajo 50° el SLS no es aplicable sin equipos de arrastre (911 Metallurgist).');
  const fw=z=>add(C,dipDir,(z-zTop)/tanD);                          // traza de caja yacente al centro del rumbo
  const niveles=[];
  for(let k=0;;k++){
    const z=zTop+k*dz; if(z>zBotMax+1e-6) break;
    const f=fw(z), a=add(f,u,-half), b=add(f,u,half);
    const sAcc=z/grade, reach=sAcc<=Lr+1e-6;
    let acc=null, xc=null, xcLen=0;
    if(reach){
      acc=pointAtS(R,sAcc);
      const t=Math.max(-half,Math.min(half,(acc.x-f.x)*u.x+(acc.n-f.n)*u.n));
      const tgt=add(f,u,t);
      xc={a:{x:acc.x,n:acc.n},b:tgt}; xcLen=dist(xc.a,xc.b);
    } else W.push(`El subnivel a −${z} m queda bajo el fondo de la rampa (−${zRampa.toFixed(0)} m): no tiene acceso.`);
    const mid=add(f,dipDir,Wh/2);
    niveles.push({k,z,f,a:add(mid,u,-half),b:add(mid,u,half),reach,acc,xc,xcLen,sAcc});
  }
  if(niveles.length<2) W.push('Se necesitan al menos dos subniveles para formar caserones; revisa techo, fondo e intervalo.');
  // Caserones entre subniveles consecutivos
  const caserones=[], pilares=[];
  const dens=p.densidad, rec=p.recuperacion, dil=p.dilucion;

  try{ const s=localStorage.getItem(KEY); if(s){ const o=JSON.parse(s); if(!o.v||o.v<2){ if(o.comercial) o.comercial.flete={modo:'ton',ton:9000,tkm:300,viaje:9000}; o.v=2; } if(o.v<3){ if(o.kml&&!/<LineString/i.test(o.kml)){ o.kml=null; o.kmlName=null; } o.v=3; } if(o.v<4){ o.v=4; } const d0=defaults(); P=Object.assign(d0,o); P.op=Object.assign(d0.op,o.op||{}); if(o.op){ P.op.metas=Object.assign(defaults().op.metas,o.op.metas||{}); P.op.limites=Object.assign(defaults().op.limites,o.op.limites||{}); P.op.explosivos=Object.assign(defaults().op.explosivos,o.op.explosivos||{}); } return; } }catch(e){}
  P=defaults();
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify(P)); $('saveState').textContent='Guardado en este navegador · '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}); }catch(e){ $('saveState').textContent='No se pudo guardar en el navegador: exporta un respaldo.'; } },300);
}
const T=()=>P.tarifas[P.tarifaActiva]||P.tarifas[Object.keys(P.tarifas).sort().pop()];

/* ═════════════ Motor de cálculo ENAMI ═════════════ */
const FILAS={flot:[['nacional','Nacional (excepto indicadas)'],['matta','Agencia Matta (Vallenar)'],['cabildo','Ganga caliza Cabildo – Rancagua'],['equivalente','Tarifa equivalente']],
             lix:[['nacional','Óxidos nacional (SX-EW)'],['sxew','SX-EW Plantas ENAMI']]};
const LEY_BASE=2.5;
function filaT(t,tipo,fila){ return tipo==='flot'?(t.flot||{})[fila]:(t.lix||{})[fila]; }
function adjK(R,f){ return (f.cobranza?-R.cobranza:0)+(f.cobranza&&f.devolucion?R.cobranza:0)+(f.otorgamiento?R.otorgamiento:0)+(f.credito?-R.credito:0); }

function liquidar(o,t){
  const R=filaT(t,o.tipo,o.fila); if(!R) return null;
  const warn=[], L=[];
  const hum=Math.max(0,Math.min(99,o.hum||0));
  const tms=o.tms!=null?o.tms:o.tmh*(1-hum/100), tmh=o.tmh!=null?o.tmh:tms/(1-hum/100);
  const ley=o.ley||0;
  let v=R.base+R.escala*(ley-LEY_BASE);
  L.push({c:'Valor tarifa (base + escala)', f:`${fmt(R.base)} + ${fmt(R.escala)} × (${fmt(ley,2)} − ${fmt(LEY_BASE,1)})`, u:v});
  if(v<0){ warn.push('A esta ley la fórmula de la tarifa da un valor negativo: el mineral no tendría valor de compra.'); }
  const f=o.flags||{};
  if(f.cobranza) L.push({c:'Cobranza Fondo de Estabilización', f:`− ${fmt(R.cobranza)} × ${fmt(ley,2)}`, u:-R.cobranza*ley});
  if(f.cobranza&&f.devolucion) L.push({c:'Devolución equivalente a la cobranza', f:'nota de la circular', u:R.cobranza*ley});
  if(f.otorgamiento) L.push({c:'Otorgamiento Fondo de Estabilización', f:`+ ${fmt(R.otorgamiento)} × ${fmt(ley,2)}`, u:R.otorgamiento*ley});
  if(f.credito) L.push({c:'Cobranza crédito tarifa individual', f:`− ${fmt(R.credito)} × ${fmt(ley,2)}`, u:-R.credito*ley});
  if(o.tipo==='lix'){
    const A=t.lix&&t.lix.acido&&t.lix.acido[o.fila];
    if(A&&o.acido!=null){ const u=-(o.acido-A.consumoBase)*ley*A.ajuste; L.push({c:'Ajuste por consumo de ácido', f:`−(${fmt(o.acido,2)} − ${fmt(A.consumoBase,2)}) kg/kg × ${fmt(ley,2)} × ${fmt(A.ajuste)}`, u}); }
  }
  if(o.tipo==='flot' && t.sub){
    const n=t.notas||{};
    if(o.au>0){ const d=n.auDescConc||0, pay=Math.max(0,o.au-d); L.push({c:'Subproducto oro', f:`(${fmt(o.au,2)} − ${fmt(d,2)}) g/t × ${fmt(t.sub.au)}`, u:pay*t.sub.au}); }
    if(o.ag>0){ if(o.ag>=(n.agMin||0)){ const d=n.agDescConc||0, pay=Math.max(0,o.ag-d); L.push({c:'Subproducto plata', f:`(${fmt(o.ag,1)} − ${fmt(d,1)}) g/t × ${fmt(t.sub.ag)}`, u:pay*t.sub.ag}); }
      else warn.push(`La plata (${fmt(o.ag,1)} g/t) está bajo la ley mínima pagable de ${fmt(n.agMin)} g/t: no se paga.`); }
  }
  // Castigos
  const C=t.castigos||{min:[],hum:[]};
  const H=(C.hum||[]).find(x=>x.el==='minerales');
  if(H&&hum>H.tol){ L.push({c:'Castigo por humedad', f:`(${fmt(hum,1)} − ${fmt(H.tol,1)}) % / ${fmt(H.per)} % × ${fmt(H.monto)}`, u:-(hum-H.tol)/H.per*H.monto, cast:true}); if(hum>H.max) warn.push(`Humedad ${fmt(hum,1)} % sobre el máximo aceptable (${fmt(H.max,1)} %).`); }
  const imp=o.imp||{};
  const groups={}; (C.min||[]).forEach(r=>{(groups[r.el]=groups[r.el]||[]).push(r);});
  for(const [el,rows] of Object.entries(groups)){
    const val=+imp[el]; if(!(val>0)) continue;
    rows.sort((a,b)=>a.tol-b.tol);
    let u=0, parts=[];
    rows.forEach((r,i)=>{ const top=i<rows.length-1?rows[i+1].tol:Infinity; const ex=Math.min(val,top)-r.tol; if(ex>0){ u+=ex/r.per*r.monto; parts.push(`${fmt(ex,3)}/${fmt(r.per,1)}×${fmt(r.monto)}`); } });
    if(u>0) L.push({c:`Castigo ${el}`, f:parts.join(' + ')+(rows.length>1?' (por tramos)':''), u:-u, cast:true});
    const mx=rows[rows.length-1].max; if(val>mx) warn.push(`${el[0].toUpperCase()+el.slice(1)} ${fmt(val,3)} ${rows[0].unit} supera el máximo aceptable (${fmt(mx,3)} ${rows[0].unit}).`);
  }
  const unit=L.reduce((s,x)=>s+x.u,0);
  const valor=Math.max(0,unit)*tms;
  const ret=o.retencion?valor*(t.retencion||0)/100:0;
  const serv=[]; const S=t.serv||{};
  if(f.pesada&&S.pesada) serv.push({c:'Pesada de camiones', f:`${fmt(o.camiones||0)} × ${fmt(S.pesada)}`, total:(o.camiones||0)*S.pesada});
  if(f.descarga&&S.descarga) serv.push({c:'Descarga a cancha o tolva', f:`${fmt(tmh,1)} tmh × ${fmt(S.descarga)}`, total:tmh*S.descarga});
  const servT=serv.reduce((s,x)=>s+x.total,0);
  const liquido=valor-ret-servT;
  return {R,L,unit,tms,tmh,valor,ret,serv,servT,liquido,warn,k:adjK(R,f)};
}
function leyEquilibrio(costoTms,o,t){
  const R=filaT(t,o.tipo,o.fila); if(!R) return null;
  const r=o.retencion?(t.retencion||0)/100:0, k=adjK(R,o.flags||{});
  const ley=(costoTms/(1-r)-R.base+LEY_BASE*R.escala)/(R.escala+k);
  return ley;
}

/* ═════════════ Modelo del proyecto ═════════════ */
let D=null;
function compute(){
  const t=T(), d=P.diseno, c=P.comercial;
  const area=d.ancho*d.alto, avance=d.barra*d.eficiencia, tPorM=area*d.densidad;
  const mMin=Math.max(0,d.largo-d.bocamina);
  const tBoc=d.bocamina*tPorM, tMin=mMin*tPorM;
  const hum=d.humedad||0, tms=tMin, tmh=hum>0?tms/(1-hum/100):tms;
  const viajes=d.camion>0?Math.ceil(tmh/d.camion):0;
  const liq=liquidar({tipo:c.tipo,fila:c.fila,tms,tmh,hum,ley:d.ley,au:c.au,ag:c.ag,acido:c.acido,camiones:viajes,flags:c.flags,retencion:c.retencion,imp:{}},t);
  const flete=c.flete.modo==='ton'?tmh*(+c.flete.ton||0):c.flete.modo==='tkm'?tmh*P.proyecto.distanciaKm*c.flete.tkm:viajes*c.flete.viaje;
  const tc=c.tcManual||t.tc;
  // CAPEX
  const items=P.capex.map(it=>{ const cant=it.link==='mMin'?mMin:+it.cant||0; return Object.assign({},it,{cantE:cant,total:it.on?cant*(+it.pu||0):0}); });
  const meses=Math.max(1,P.flujo.metrosMes.length);
  const moBase=P.mo.roles.reduce((s,r)=>s+(+r.n||0)*(+r.pu||0),0)*(P.mo.mensual?meses:1);
  const moLeyes=moBase*(+P.mo.leyes||0), moTot=moBase+moLeyes;
  const cat={A:0,B:0,C:moTot,D:0,E:0}; items.forEach(i=>cat[i.cat]+=i.total);
  const capex=cat.A+cat.B+cat.C+cat.D+cat.E;
  const inicio=cat.A+cat.D+cat.E;
  // Valor neto por metro de mineral
  const ingresoNeto=(liq?liq.liquido:0);
  const porM=mMin>0?(ingresoNeto-flete)/mMin:0;
  const brutoPorM=mMin>0?(liq?liq.valor:0)/mMin:0;
  // Simulación metro a metro
  const L=Math.max(1,Math.round(d.largo)), lote=Math.max(1,+P.flujo.loteMetros||1);
  const pamma=P.flujo.incluirPamma?(+P.flujo.pamma||0):0;
  const moMes=cat.C/Math.max(1,P.flujo.metrosMes.length), tunM=mMin>0?cat.B/mMin:0; let mesPrev=-1;
  const serie=[{m:0,sin:-inicio,con:-inicio+pamma}];
  let cum=-inicio, pend=0, minSin=-inicio, minCon=-inicio+pamma, minAt=0, minero=0;
  // distribución mensual
  const mm_=P.flujo.metrosMes.map(Number); const lim=[]; let acc=0; mm_.forEach(x=>{acc+=x;lim.push(acc);});
  const mesDe=m=>{ for(let i=0;i<lim.length;i++) if(m<=lim[i]+1e-9) return i; return lim.length-1; };
  const mesesR=mm_.map((x,i)=>({mes:i+1,metros:x,ingresos:0,flete:0,inversion:0,mo:0,pamma:0}));
  mesesR[0].inversion+=inicio; mesesR[0].pamma+=pamma;
  const ingM=mMin>0?ingresoNeto/mMin:0, fleM=mMin>0?flete/mMin:0;
  let pendIng=0, pendFle=0;
  for(let m=1;m<=L;m++){
    const mi=mesDe(m), isMin=m>d.bocamina;
    if(mi!==mesPrev){ for(let k=mesPrev+1;k<=mi;k++){ cum-=moMes; mesesR[k].mo+=moMes; } mesPrev=mi; }
    cum-=(isMin?tunM:0); mesesR[mi].inversion+=(isMin?tunM:0);
    if(isMin){ minero++; pendIng+=ingM; pendFle+=fleM; }
    if(cum<minSin){ minSin=cum; minAt=m; }
    minCon=Math.min(minCon,cum+pamma);
    if(isMin && (minero%lote===0 || m===L)){
      cum+=pendIng-pendFle; mesesR[mi].ingresos+=pendIng; mesesR[mi].flete+=pendFle; pendIng=0; pendFle=0;
    }
    serie.push({m,sin:cum,con:cum+pamma});
  }
  const netoSin=cum, netoCon=cum+pamma;
  mesesR.forEach(r=>{ r.neto=r.ingresos-r.flete-r.inversion-r.mo+r.pamma; });
  let a2=0; mesesR.forEach(r=>{a2+=r.neto;r.acum=a2;});
  const im=Math.pow(1+(+P.flujo.tasaAnual||0),1/12)-1;
  const van=mesesR.reduce((s,r,i)=>s+r.neto/Math.pow(1+im,i+1),0);
  const costoTms=tms>0?(capex+flete)/tms:null;
  const leq=costoTms!=null?leyEquilibrio(costoTms,{tipo:c.tipo,fila:c.fila,flags:c.flags,retencion:c.retencion},t):null;
  D={t,tc,area,avance,tPorM,mMin,tBoc,tMin,tms,tmh,viajes,liq,flete,items,cat,capex,inicio,moBase,moLeyes,moTot,
     serie,netoSin,netoCon,minSin,minCon,minAt,mesesR,van,im,costoTms,leq,pamma,
     cuFino:tMin*d.ley/100, disparos:d.largo/avance, dispMin:mMin/avance, dispBoc:d.bocamina/avance,
     tDisp:avance*area*d.densidad, vBanco:d.largo*area, vEsp:d.largo*area*(1+d.esponjamiento), metrosMesOk:Math.abs(acc-d.largo)<1e-6, metrosMesSum:acc};
  D.sls=computeMine(); D.plan=buildSchedule(D.sls);
  return D;
}

/* ═════════════ Alertas ═════════════ */
function alertas(){
  const A=[], t=D.t, d=P.diseno, c=P.comercial;
  const now=new Date(), curId=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  if(t.id<curId) A.push({lvl:'warn',t:`La tarifa vigente es de ${t.mes} ${t.anio}`,d:'Carga la circular ENAMI del mes en curso para actualizar los valores.',go:'tarifa'});
  if(c.leyMinima==null) A.push({lvl:'warn',t:'Ley mínima de compra sin confirmar',d:`La circular indica que rigen las leyes mínimas de cada agencia. Confirma con la agencia que compra mineral de ${fmt(d.ley,2)} % CuI.`,go:'calc'});
  else if(d.ley<c.leyMinima) A.push({lvl:'crit',t:'Ley del proyecto bajo la ley mínima de la agencia',d:`${fmt(d.ley,2)} % < ${fmt(c.leyMinima,2)} %: ENAMI no compraría este mineral.`,go:'calc'});
  if(D.leq!=null&&d.ley<D.leq) A.push({lvl:'crit',t:'Ley bajo la ley de equilibrio',d:`Se necesita ${fmt(D.leq,2)} % CuI para cubrir inversión y flete.`,go:'flujo'});
  if(c.flete.modo==='ton'&&(c.flete.ton<7000||c.flete.ton>9000)) A.push({lvl:'warn',t:'Flete fuera del rango informado',d:`Se usa ${money(c.flete.ton)}/t; el rango informado es $7.000–9.000 por tonelada.`,go:'diseno'});
  else if(c.flete.modo!=='ton') A.push({lvl:'warn',t:'Flete con un modo distinto al informado',d:'El flete informado es por tonelada ($7.000–9.000/t).',go:'diseno'});
  else A.push({lvl:'info',t:`Flete ${money(c.flete.ton)} por tonelada`,d:'Rango informado $7.000–9.000/t. Se ajusta en Diseño y producción.',go:'diseno'});
  if(!d.humedad) A.push({lvl:'info',t:'Humedad del mineral no informada',d:'Se asume 0 %. ENAMI paga por tonelada seca y castiga sobre 3 % de humedad.',go:'diseno'});
  if(!D.metrosMesOk) A.push({lvl:'crit',t:'Plan mensual no suma el largo del túnel',d:`Los metros por mes suman ${fmt(D.metrosMesSum)} m y el túnel mide ${fmt(d.largo)} m.`,go:'diseno'});
  if(/spa/i.test(P.proyecto.titular)) A.push({lvl:'warn',t:'Rebaja de patente: revisar si una SpA califica',d:'Según SONAMI, la rebaja es para personas naturales, sociedades legales mineras o cooperativas mineras.',go:'legal'});
  if(P.capex.some(i=>i.pend&&i.on)) A.push({lvl:'info',t:'Costos pendientes de confirmar',d:'Reparación de campamento ($1.000.000) incluida como valor revisado, sin confirmación final.',go:'costos'});
  if(!P.mo.mensual) A.push({lvl:'info',t:'Mano de obra: confirmar si los sueldos son mensuales',d:'La hoja CAPEX indica "pers×2m" ($8,45 MM en total). Si los precios son mensuales, activa la opción en Costos.',go:'costos'});
  if(D.liq) D.liq.warn.forEach(w=>A.push({lvl:'crit',t:'Liquidación',d:w,go:'calc'}));
  if(D.sls&&D.sls.ok) A.push({lvl:'info',t:'Diseño SLS conceptual',d:'La geometría del cuerpo IOCG es un supuesto; los parámetros vienen de casos de referencia y deben validarse.',go:'sls'});
  (D.sls&&D.sls.warn||[]).forEach(w=>A.push({lvl:'warn',t:'Diseño SLS',d:w,go:'sls'}));
  const atr=(D.plan||[]).filter(t=>t.atrasada).length; if(atr) A.push({lvl:'warn',t:`${atr} obras atrasadas`,d:'Término vencido con avance menor a 100 %.',go:'obras'});
  return A;
}

/* ═════════════ Gráficos SVG ═════════════ */
function lineChart(el,opt){
  const W=Math.max(320,el.clientWidth||640), H=opt.h||240, m={l:76,r:16,t:14,b:34};
  const xs=opt.x, series=opt.series; const n=xs.length;
  let ymin=Math.min(0,...series.flatMap(s=>s.y)), ymax=Math.max(0,...series.flatMap(s=>s.y));
  if(ymin===ymax){ymax+=1;}
  const pad=(ymax-ymin)*0.08; ymin-=pad; ymax+=pad;
  const X=i=>m.l+(W-m.l-m.r)*(n<=1?0:i/(n-1)), Y=v=>m.t+(H-m.t-m.b)*(1-(v-ymin)/(ymax-ymin));
  const ticks=niceTicks(ymin,ymax,5);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(opt.title||'')}">`;
  ticks.forEach(v=>{ s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===0?'#5f6c70':'#263034'}" stroke-width="1"${v===0?'':' stroke-dasharray="2 3"'}/><text x="${m.l-8}" y="${Y(v)+4}" fill="#8f9c9f" font-size="11" font-family="IBM Plex Mono, monospace" text-anchor="end">${opt.yFmt(v)}</text>`; });
  const xt=opt.xTicks||[0,Math.floor((n-1)/2),n-1];
  xt.forEach(i=>{ if(i<0||i>=n) return; s+=`<text x="${X(i)}" y="${H-10}" fill="#8f9c9f" font-size="11" font-family="IBM Plex Mono, monospace" text-anchor="middle">${opt.xFmt(xs[i])}</text>`; });
  series.forEach(se=>{
    const d=se.y.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
    if(se.area){ s+=`<path d="${d}L${X(n-1)},${Y(Math.max(ymin,0))}L${X(0)},${Y(Math.max(ymin,0))}Z" fill="${se.color}" opacity=".10"/>`; }
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round"${se.dash?' stroke-dasharray="5 4"':''}/>`;
  });
  (opt.marks||[]).forEach(mk=>{ const x=X(mk.i), y=Y(mk.v); s+=`<circle cx="${x}" cy="${y}" r="5" fill="${mk.color}" stroke="#151c1f" stroke-width="2"/><text x="${x+(x>W*0.7?-9:9)}" y="${y+(mk.below?16:-9)}" fill="#ebe6dd" font-size="11.5" font-family="IBM Plex Mono, monospace" text-anchor="${x>W*0.7?'end':'start'}">${esc(mk.label)}</text>`; });
  s+=`<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="#8f9c9f" stroke-width="1" opacity="0"/>`;
  s+=`<rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" class="hit"/>`;
  s+='</svg>';
  el.innerHTML=s+'<div class="tip" hidden></div>';
  const svg=el.querySelector('svg'), tip=el.querySelector('.tip'), xh=el.querySelector('.xh');
  el.querySelector('.hit').addEventListener('pointermove',e=>{
    const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(n-1,Math.round((px-m.l)/(W-m.l-m.r)*(n-1))));
    xh.setAttribute('x1',X(i)); xh.setAttribute('x2',X(i)); xh.setAttribute('opacity','.5');
    tip.hidden=false; tip.innerHTML=`<div>${esc(opt.xLabel?opt.xLabel(xs[i]):xs[i])}</div>`+series.map(se=>`<div><span style="color:${se.color}">■</span> ${esc(se.name)}: ${opt.yFmt(se.y[i],true)}</div>`).join('');
    const tx=X(i)*r.width/W; tip.style.left=Math.min(r.width-tip.offsetWidth-4,Math.max(4,tx+12))+'px'; tip.style.top='8px';
  });
  el.querySelector('.hit').addEventListener('pointerleave',()=>{tip.hidden=true;xh.setAttribute('opacity','0');});
}
function barChart(el,opt){
  const W=Math.max(320,el.clientWidth||640), H=opt.h||220, m={l:76,r:12,t:12,b:30};
  const cats=opt.cats, ser=opt.series; const all=ser.flatMap(s=>s.y);
  let ymin=Math.min(0,...all), ymax=Math.max(0,...all); if(ymin===ymax) ymax=1;
  const pad=(ymax-ymin)*.08; ymax+=pad; if(ymin<0) ymin-=pad;
  const Y=v=>m.t+(H-m.t-m.b)*(1-(v-ymin)/(ymax-ymin));
  const gw=(W-m.l-m.r)/cats.length, bw=Math.min(34,(gw*0.7)/ser.length);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(opt.title||'')}">`;
  niceTicks(ymin,ymax,4).forEach(v=>{ s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===0?'#5f6c70':'#263034'}"${v===0?'':' stroke-dasharray="2 3"'}/><text x="${m.l-8}" y="${Y(v)+4}" fill="#8f9c9f" font-size="11" font-family="IBM Plex Mono, monospace" text-anchor="end">${opt.yFmt(v)}</text>`; });
  cats.forEach((c,ci)=>{
    const gx=m.l+gw*ci+gw/2-(bw*ser.length+2*(ser.length-1))/2;
    ser.forEach((se,si)=>{ const v=se.y[ci], x=gx+si*(bw+2), y0=Y(0), y1=Y(v), top=Math.min(y0,y1), h=Math.max(1,Math.abs(y1-y0));
      s+=`<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${se.color}"><title>${esc(c)} · ${esc(se.name)}: ${opt.yFmt(v,true)}</title></rect>`; });
    s+=`<text x="${m.l+gw*ci+gw/2}" y="${H-9}" fill="#8f9c9f" font-size="11" font-family="IBM Plex Mono, monospace" text-anchor="middle">${esc(c)}</text>`;
  });

function niceTicks(a,b,n){ const span=b-a; const step0=span/n; const mag=Math.pow(10,Math.floor(Math.log10(step0))); const st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>span/x<=n)||10*mag; const out=[]; for(let v=Math.ceil(a/st)*st; v<=b+1e-9; v+=st) out.push(Math.abs(v)<1e-9?0:v); return out; }

function field(label,key,unit,o={}){

document.addEventListener('input',onBind); document.addEventListener('change',onBind);
function onBind(e){
  const el=e.target; const k=el.dataset&&el.dataset.k; if(!k) return;
  if(e.type==='input' && (el.type==='checkbox'||el.tagName==='SELECT'||el.dataset.lazy||el.type==='date')) return;
  let v;
  if(el.type==='checkbox') v=el.checked;
  else if(el.tagName==='SELECT'){ v=el.value; if(/^-?\d+(\.\d+)?$/.test(v) && !el.dataset.str) v=+v; if(v==='') v=null; }
  else if(el.type==='number'){ v=el.value===''?null:+el.value; if(v!=null&&!isFinite(v)) return; }
  else v=el.value;
  setP(k,v);
  if(k==='calc.tipo') P.calc.fila=FILAS[v][0][0];
  if(el.dataset.rebuild){ save(); recompute(true); return; }
  save(); recompute(false);
}

/* ── Calculadora ── */
TABV.calc={
  build(el){
    const t=D.t; const c=P.calc;
    const names=[...new Set(((t.castigos||{}).min||[]).map(r=>r.el))];
    el.innerHTML=`
    <div class="split">
      <div class="grid">
        <div class="card"><h3>Lote a liquidar</h3>
          <div class="fields">
            ${field('Tipo de mineral','calc.tipo','',{options:[['flot','Sulfuro · flotación (CuI)'],['lix','Óxido · lixiviación (CuS)']]}).replace('data-k=','data-rebuild="1" data-str="1" data-k=')}
            ${field('Tarifa aplicable','calc.fila','',{options:FILAS[c.tipo]}).replace('data-k=','data-str="1" data-k=')}
            ${field('Toneladas húmedas','calc.tmh','tmh')}
            ${field('Humedad','calc.hum','%')}
            ${field(c.tipo==='flot'?'Ley de cobre insoluble':'Ley de cobre soluble','calc.ley','% Cu',{step:0.01})}
            ${field('Camiones (pesadas)','calc.camiones','n°',{step:1,min:0})}
            ${c.tipo==='flot'?field('Oro','calc.au','g/t')+field('Plata','calc.ag','g/t'):field('Consumo de ácido','calc.acido','kg/kg Cu')}
          </div>
          <details><summary>Impurezas (castigos)</summary><div class="fields">${names.map(n=>{const r=t.castigos.min.find(x=>x.el===n);return field(n[0].toUpperCase()+n.slice(1),'calc.imp.'+n,r.unit,{step:0.01,ph:'0'});}).join('')}</div>
            <p class="note">El cloro tiene dos tramos en la circular; se aplica cada tramo a la porción de ley que le corresponde (interpretación a confirmar con la agencia).</p></details>
        </div>
        <div class="card"><h3>Componentes de la liquidación</h3>
          ${tog('Descontar cobranza del Fondo de Estabilización','calc.flags.cobranza','$/tms por cada 1 % de Cu')}
          ${tog('Sumar devolución equivalente a la cobranza','calc.flags.devolucion','Según la nota de la circular de octubre 2026')}
          ${tog('Sumar otorgamiento del Fondo de Estabilización','calc.flags.otorgamiento','Solo cuando ENAMI otorga sustentación')}
          ${tog('Descontar cobranza de crédito de tarifa individual','calc.flags.credito','Solo si el productor tiene ese crédito')}
          ${tog('Retención Art. 23 D.L. 824','calc.retencion',`${fmt(t.retencion)} % · imputable a impuestos según tu régimen`)}
          ${tog('Cobrar pesada de camión','calc.flags.pesada',`${money(t.serv.pesada)} por camión`)}
          ${tog('Cobrar descarga a cancha o tolva','calc.flags.descarga',`${money(t.serv.descarga)} por tmh`)}
        </div>
      </div>
      <div class="grid">
        <div class="kpis" data-out="kpis"></div>
        <div data-out="warn" class="alerts"></div>
        <div class="card"><h3>Detalle por tonelada seca <small data-out="trow"></small></h3><div class="tw" data-out="det"></div></div>
        <div class="card"><h3>Sensibilidad a la ley <small>valor por tms con la tarifa vigente</small></h3><div class="chart" data-out="sens"></div><div class="tw" data-out="senst"></div></div>
        <div class="card"><h3>Comparar con una liquidación real</h3>
          <div class="fields">${field('Monto líquido pagado por ENAMI','calc.real','$')}${field('Ley mínima de compra de la agencia','comercial.leyMinima','% Cu',{step:0.01,ph:'Confirmar con la agencia'})}</div>
          <div data-out="real"></div>
          <p class="note">Usa una liquidación real para calibrar: si la diferencia es grande, revisa qué componentes aplica ENAMI a tu cuenta (cobranzas, créditos o castigos).</p>
        </div>
      </div>
    </div>
    <div class="card"><h3>Cómo se calcula</h3>
      <p class="note">Valor por tonelada seca = Base + Escala × (Ley − 2,5 %). Cobranza, otorgamiento y crédito se expresan en $/tms por cada 1 % de Cu y se multiplican por la ley. Toneladas secas = toneladas húmedas × (1 − humedad). Castigo de humedad sobre ${fmt(((t.castigos||{}).hum||[])[0]?.tol,1)} %: ${money(((t.castigos||{}).hum||[])[0]?.monto)} por cada 1 %. Subproductos de flotación: oro (ley − ${fmt(t.notas.auDescConc,2)} g/t) × ${money(t.sub.au)}; plata desde ${fmt(t.notas.agMin)} g/t, (ley − ${fmt(t.notas.agDescConc,1)} g/t) × ${money(t.sub.ag)}. Las leyes mínimas por agencia no vienen en la circular.</p>
      <p class="note">Contraste con el modelo Excel: con la tarifa de junio 2025 (base 148.710; escala 75.404; cobranza 2.281; crédito 1.809) la fórmula da 35.604 $/tms a 1 % CuI, y 31.514 $/tms descontando cobranza y crédito, cercano a los 31.710 $/t del modelo.</p>
    </div>`;
  },
  refresh(el){
    const t=D.t, c=P.calc;
    const q=liquidar({tipo:c.tipo,fila:c.fila,tmh:+c.tmh||0,hum:+c.hum||0,ley:+c.ley||0,au:+c.au||0,ag:+c.ag||0,acido:c.acido,camiones:+c.camiones||0,flags:c.flags,retencion:c.retencion,imp:c.imp},t);
    if(!q){ el.querySelector('[data-out=kpis]').innerHTML='<div class="kpi"><span>Tarifa</span><b>No disponible</b></div>'; return; }
    el.querySelector('[data-out=kpis]').innerHTML=[
      ['Valor por tms',money(q.unit),'después de ajustes y castigos','acc'],
      ['Toneladas secas',fmt(q.tms,2)+' tms',`${fmt(q.tmh,2)} tmh`],
      ['Valor del lote',money(q.valor),usd(q.valor/t.tc)],
      ['Retención',money(-q.ret),fmt(c.retencion?t.retencion:0)+' %'],
      ['Servicios',money(-q.servT),q.serv.map(s=>s.c).join(' · ')||'ninguno'],
      ['Líquido a recibir',money(q.liquido),usd(q.liquido/t.tc),sgn(q.liquido)]
    ].map(x=>`<div class="kpi ${x[3]||''}"><span>${x[0]}</span><b>${x[1]}</b><small>${esc(x[2])}</small></div>`).join('');
    const w=[...q.warn]; if(P.comercial.leyMinima!=null && c.ley<P.comercial.leyMinima) w.unshift(`Ley ${fmt(c.ley,2)} % bajo la ley mínima de compra informada (${fmt(P.comercial.leyMinima,2)} %).`);
    el.querySelector('[data-out=warn]').innerHTML=w.map(x=>`<div class="alert crit"><span class="pill crit">Atención</span><b>${esc(x)}</b></div>`).join('');
    el.querySelector('[data-out=trow]').textContent=`${FILAS[c.tipo].find(f=>f[0]===c.fila)?.[1]||''} · ${t.mes} ${t.anio}`;
    el.querySelector('[data-out=det]').innerHTML=`<table><thead><tr><th>Concepto</th><th>Cálculo</th><th class="n">$/tms</th><th class="n">Total lote</th></tr></thead><tbody>
      ${q.L.map(x=>`<tr><td>${esc(x.c)}</td><td class="formula">${esc(x.f||'')}</td><td class="n ${x.u<0?'neg':''}">${money(x.u)}</td><td class="n ${x.u<0?'neg':''}">${money(x.u*q.tms)}</td></tr>`).join('')}
      <tr class="tot"><td colspan="2">Valor de compra</td><td class="n">${money(q.unit)}</td><td class="n">${money(q.valor)}</td></tr>
      ${c.retencion?`<tr><td>Retención Art. 23 D.L. 824</td><td class="formula">${fmt(t.retencion)} % del valor</td><td></td><td class="n neg">${money(-q.ret)}</td></tr>`:''}
      ${q.serv.map(s=>`<tr><td>${esc(s.c)}</td><td class="formula">${esc(s.f)}</td><td></td><td class="n neg">${money(-s.total)}</td></tr>`).join('')}
      <tr class="tot"><td colspan="3">Líquido estimado</td><td class="n">${money(q.liquido)}</td></tr></tbody></table>`;
    const leyes=[]; for(let l=0.5;l<=4.0001;l+=0.25) leyes.push(+l.toFixed(2));
    const vals=leyes.map(l=>{const r=liquidar({tipo:c.tipo,fila:c.fila,tms:1,hum:0,ley:l,acido:c.acido,flags:c.flags,imp:{}},t);return r?Math.max(0,r.unit):0;});
    const ci=leyes.reduce((b,l,i)=>Math.abs(l-c.ley)<Math.abs(leyes[b]-c.ley)?i:b,0);
    const marks=[{i:ci,v:vals[ci],color:'#f0a26a',label:`${fmt(leyes[ci],2)} % → ${money(vals[ci])}`}];
    if(D.costoTms){ const li=leyes.reduce((b,l,i)=>Math.abs(vals[i]-D.costoTms)<Math.abs(vals[b]-D.costoTms)?i:b,0); }
    lineChart(el.querySelector('[data-out=sens]'),{title:'Valor por tms según ley',x:leyes,series:[{name:'Valor por tms',color:'#f0a26a',y:vals,area:true}],yFmt:(v,f)=>f?money(v):fmt(v/1000,0)+' mil',xFmt:v=>fmt(v,1)+' %',xLabel:v=>`Ley ${fmt(v,2)} %`,xTicks:[0,2,4,6,8,10,12,14].filter(i=>i<leyes.length),marks,h:220});
    el.querySelector('[data-out=senst]').innerHTML=`<table><thead><tr><th>Ley % Cu</th>${leyes.filter((_,i)=>i%2===0).map(l=>`<th class="n">${fmt(l,1)}</th>`).join('')}</tr></thead><tbody><tr><td>$/tms</td>${vals.filter((_,i)=>i%2===0).map(v=>`<td class="n">${fmt(v)}</td>`).join('')}</tr></tbody></table>`;
    const real=+c.real;
    el.querySelector('[data-out=real]').innerHTML=real>0?`<p>Calculado ${money(q.liquido)} · real ${money(real)} · diferencia <b class="${sgn(real-q.liquido)}">${money(real-q.liquido)}</b> (${pct((real-q.liquido)/q.liquido*100,2)}).</p>`:'';
  }
};

          ${field('Tarifa por t·km','comercial.flete.tkm','$/t·km',{src:'Modelo original (ya no se usa)'})}

        <div class="row"><button class="b sm" type="button" id="addMes">Agregar mes</button><button class="b sm" type="button" id="delMes">Quitar último mes</button><button class="b sm" type="button" id="eqMes">Repartir parejo</button></div></div>

    ].map(x=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b>${x[2]?`<small>${esc(x[2])}</small>`:''}</div>`).join('');

    el.querySelector('[data-out=cub]').innerHTML=`<table><thead><tr><th>Parámetro</th><th class="n">Bocamina</th><th class="n">Mineral</th><th class="n">Total</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="n">${fmt(r[1],r[4])}</td><td class="n">${fmt(r[2],r[4])}</td><td class="n">${fmt(r[1]+r[2],r[4])}</td><td class="src">${r[3]}</td></tr>`).join('')}</tbody></table>`;
    el.querySelector('[data-out=pm]').textContent=`${fmt(d.metrosMesSum)} de ${fmt(p.largo)} m`;
    const pl=el.querySelector('[data-out=plan]');

      pl.dataset.n=P.flujo.metrosMes.length;

    }
    let acc=0;
    P.flujo.metrosMes.forEach((m,i)=>{ const a=acc; acc+=+m||0; const min=Math.max(0,Math.min(+m||0,acc-Math.max(a,p.bocamina)));
      pl.querySelector(`[data-pm=r${i}]`).textContent=`${fmt(a)}–${fmt(acc)}`; pl.querySelector(`[data-pm=m${i}]`).textContent=fmt(min,1);
      pl.querySelector(`[data-pm=t${i}]`).textContent=fmt(min*d.tPorM,1); pl.querySelector(`[data-pm=d${i}]`).textContent=fmt((+m||0)/d.avance,1); });
    pl.querySelector('[data-pm=warn]').textContent=d.metrosMesOk?'':'Los metros por mes deben sumar el largo total del túnel.';
  }
};

function estLote(l){
  const id=(l.fecha||'').slice(0,7); const t=P.tarifas[id]||T();
  const q=liquidar({tipo:P.comercial.tipo,fila:P.comercial.fila,tmh:l.tmh,hum:l.hum,ley:l.ley,camiones:1,flags:P.comercial.flags,retencion:P.comercial.retencion,imp:{}},t);
  if(q) q.tar=`tarifa ${t.mes} ${t.anio}`+(P.tarifas[id]?'':' (vigente)'); return q;
}

/* ═════════════ Coordenadas locales (mismo origen que la maqueta) ═════════════ */
const ORG={lon:-70.55515394729338,lat:-28.38506143035627}, RE_=6378137, COS0=Math.cos(ORG.lat*D2R);
const toLocalM=(lon,lat)=>({x:(lon-ORG.lon)*D2R*RE_*COS0, n:(lat-ORG.lat)*D2R*RE_});
const fromLocalM=(x,n)=>({lon:ORG.lon+x/(RE_*COS0)/D2R, lat:ORG.lat+n/RE_/D2R});
function rampLocal(){ const r=(P.rampPath||[]).map(c=>toLocalM(c[0],c[1])); if(P.ramp.reverse) r.reverse(); return r; }
function computeMine(){
  const G=MineSLS.generate(P.sls,rampLocal(),P.ramp.grade/100);
  if(G.ok){
    const lq=liquidar({tipo:'flot',fila:P.comercial.fila,tms:1,hum:0,ley:G.q.leyDil,flags:P.comercial.flags,imp:{}},T());
    G.q.valorUnit=lq?Math.max(0,lq.unit):null; G.q.valor=G.q.valorUnit!=null?G.q.valorUnit*G.q.tMin:null;
    const tun=P.capex.find(i=>i.link==='mMin'); G.q.costoM=tun?+tun.pu:null; G.q.costoDesarrollo=G.q.costoM?G.q.costoM*(G.q.desarrollo+G.q.traspaso+G.q.ventilacion):null;
    G.q.costoExplot=P.sls.costoT>0?P.sls.costoT*G.q.tMin:null;
  }
  return G;
}

/* ═════════════ Programa (Gantt) ═════════════ */
const addM=(d,m)=>new Date(d.getTime()+m*30.4375*864e5);
const iso=d=>d.toISOString().slice(0,10);
function buildSchedule(G){
  const tasks=[], st=P.obrasEstado||{};
  const t0=new Date((P.plan.inicio||'2027-09-01')+'T12:00:00'), av=Math.max(1,+P.plan.avanceMes||60), avC=Math.max(1,+P.plan.avanceChimenea||30);
  const push=(id,nombre,grupo,ini,fin,extra)=>{ const s=st[id]||{}; tasks.push(Object.assign({id,nombre,grupo,ini,fin,avance:+s.avance||0,estado:s.estado||'',auto:true},extra||{})); };
  const tunFin=addM(t0,P.diseno.largo/av);
  push('TUN',`Túnel principal ${fmt(P.diseno.largo)} m (bocamina + mineral)`,'Proyecto inicial',t0,tunFin,{metros:P.diseno.largo});
  if(G&&G.ok){
    let cur=tunFin, sPrev=0; const done=[];
    G.niveles.forEach(l=>{ if(!l.reach) return;
      const r0=cur; cur=addM(cur,(l.sAcc-sPrev)/av); push(`RAMP${l.k+1}`,`Rampa hasta SN${l.k+1} (−${fmt(l.z)} m)`,'Rampa',r0,cur,{metros:l.sAcc-sPrev}); sPrev=l.sAcc;
      const x0=cur; cur=addM(cur,l.xcLen/av); push(`XC${l.k+1}`,`Acceso SN${l.k+1}`,`Subnivel ${l.k+1}`,x0,cur,{metros:l.xcLen});
      push(`ZS${l.k+1}`,`Zona de seguridad SN${l.k+1}`,`Subnivel ${l.k+1}`,cur,addM(cur,+P.plan.refugioMeses||0.5));
      const g0=cur; cur=addM(cur,P.sls.largo/av); push(`GP${l.k+1}`,`${l.k===G.niveles.length-1?'Galería de producción':'Galería de perforación'} SN${l.k+1}`,`Subnivel ${l.k+1}`,g0,cur,{metros:P.sls.largo});
      done[l.k]=cur;
    });
    if(done[0]){ const v=G.el.find(e=>e.tipo==='ventilacion'), o=G.el.find(e=>e.tipo==='traspaso');
      let rEnd=done[0];
      if(v){ const f=addM(done[0],G.q.ventilacion/avC); push('VR1','Chimenea de ventilación a superficie','Chimeneas y piques',done[0],f,{metros:G.q.ventilacion}); rEnd=f; }
      if(o){ const f=addM(done[0],G.q.traspaso/avC); push('OP1','Pique de traspaso de mineral','Chimeneas y piques',done[0],f,{metros:G.q.traspaso}); if(f>rEnd) rEnd=f; }
      let prev=rEnd;
      for(let r=1;r<G.niveles.length;r++){ if(!done[r]) break; const rows=G.caserones.filter(c=>c.fila===r); const t=rows.reduce((s,c)=>s+c.tMin,0);
        const s0=new Date(Math.max(prev,done[r],rEnd)); const f=addM(s0,P.sls.ritmo>0?t/P.sls.ritmo:0); push(`PROD${r}`,`Explotación fila ${r} (${rows.length} caserones · ${fmt(t/1000,0)} kt)`,'Producción SLS',s0,f,{t}); prev=f; }
    }
  }
  (P.obras||[]).forEach(o=>{ if(!o.inicio||!o.fin) return; tasks.push({id:o.id,nombre:o.nombre,grupo:'Obras planificadas',ini:new Date(o.inicio+'T12:00:00'),fin:new Date(o.fin+'T12:00:00'),avance:+o.avance||0,estado:o.estado||'',auto:false,costo:+o.costo||0}); });
  const today=new Date();
  tasks.forEach(t=>{ t.atrasada=t.fin<today&&t.avance<100; t.enCurso=t.ini<=today&&t.fin>=today; });
  return tasks;
}
function ganttSVG(tasks){
  if(!tasks.length) return '<p class="note">Sin tareas.</p>';
  const min=new Date(Math.min(...tasks.map(t=>t.ini))), max=new Date(Math.max(...tasks.map(t=>t.fin)));
  const m0=new Date(min.getFullYear(),min.getMonth(),1), months=Math.max(1,(max.getFullYear()-m0.getFullYear())*12+max.getMonth()-m0.getMonth()+1);
  const colW=months>60?14:months>24?26:44, labW=300, rowH=22, top=34, W=labW+months*colW+10, H=top+tasks.length*rowH+10;
  const X=d=>labW+((d.getFullYear()-m0.getFullYear())*12+d.getMonth()-m0.getMonth()+(d.getDate()-1)/31)*colW;
  const GC={'Proyecto inicial':'#f0a26a','Rampa':'#d27a3f','Chimeneas y piques':'#7fb3e0','Producción SLS':'#c9a227','Obras planificadas':'#b8c4c6'};
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Carta Gantt">`;
  for(let i=0;i<months;i++){ const d=new Date(m0.getFullYear(),m0.getMonth()+i,1), x=labW+i*colW;
    if(i%(months>60?6:months>24?3:1)===0) s+=`<text x="${x+2}" y="14" fill="#8f9c9f" font-size="10" font-family="IBM Plex Mono, monospace">${MESES[d.getMonth()].slice(0,3)} ${String(d.getFullYear()).slice(2)}</text>`;
    s+=`<line x1="${x}" x2="${x}" y1="${top-12}" y2="${H}" stroke="${d.getMonth()===0?'#334047':'#1e272b'}"/>`; }
  let lastG='';
  tasks.forEach((t,i)=>{ const y=top+i*rowH, x0=X(t.ini), x1=Math.max(x0+3,X(t.fin)), c=GC[t.grupo]||'#8fd3c0';
    if(t.grupo!==lastG){ s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#263034"/>`; lastG=t.grupo; }
    s+=`<text x="6" y="${y+15}" fill="${t.atrasada?'#ff9d8f':'#ebe6dd'}" font-size="11" font-family="IBM Plex Sans, sans-serif">${esc(t.nombre.length>46?t.nombre.slice(0,45)+'…':t.nombre)}</text>`;
    s+=`<rect x="${x0}" y="${y+5}" width="${x1-x0}" height="12" rx="3" fill="${c}" opacity=".35"><title>${esc(t.nombre)} · ${iso(t.ini)} → ${iso(t.fin)} · avance ${t.avance} %</title></rect>`;
    if(t.avance>0) s+=`<rect x="${x0}" y="${y+5}" width="${(x1-x0)*Math.min(100,t.avance)/100}" height="12" rx="3" fill="${c}"/>`; });
  const tx=X(new Date()); if(tx>labW&&tx<W) s+=`<line x1="${tx}" x2="${tx}" y1="${top-14}" y2="${H}" stroke="#e0564a" stroke-dasharray="3 3"/><text x="${tx+3}" y="${top-4}" fill="#ff9d8f" font-size="10" font-family="IBM Plex Mono, monospace">hoy</text>`;
  return s+'</svg>';
}

  const kml=`<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Mina La Suerte 1/6 · Diseño SLS conceptual</name>
<description>Diseño conceptual de sublevel stoping generado por la app de gestión. Cotas ${abs?'absolutas (m s.n.m.) a partir de la cota del portal '+fmt(z0)+' m':'relativas al portal de la rampa (m)'}. Ábrelo en la maqueta 3D de la app para verlo bajo el terreno.</description>
<ExtendedData><Data name="minaLaSuerte"><value><![CDATA[${json}]]></value></Data></ExtendedData>
<Style id="rampa"><LineStyle><color>ff6aa2f0</color><width>3</width></LineStyle></Style>
<Style id="acceso"><LineStyle><color>ff9ab54f</color><width>2</width></LineStyle></Style>
<Style id="galeria"><LineStyle><color>ffc0d38f</color><width>2</width></LineStyle></Style>
<Style id="chimenea"><LineStyle><color>ffe0b37f</color><width>3</width></LineStyle></Style>
<Style id="caseron"><LineStyle><color>ff3f7ad2</color></LineStyle><PolyStyle><color>663f7ad2</color></PolyStyle></Style>
<Style id="refugio"><IconStyle><color>ffb7e76e</color></IconStyle></Style><Style id="obra"><IconStyle><color>ffc6c4b8</color></IconStyle></Style>
${pm}
</Document></kml>`;

function drawPlan(el,G){
  const W=Math.max(320,el.clientWidth||600), H=Math.round(W*0.78);
  const R=rampLocal(); const pts=[...R];
  G.el.forEach(e=>{ if(e.a) pts.push(e.a,e.b); if(e.c) pts.push(...e.c); if(e.p) pts.push(e.p); });
  let x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x)),n0=Math.min(...pts.map(p=>p.n)),n1=Math.max(...pts.map(p=>p.n));
  const pad=20, sc=Math.min((W-2*pad)/(x1-x0||1),(H-2*pad)/(n1-n0||1));
  const X=x=>pad+(x-x0)*sc+((W-2*pad)-(x1-x0)*sc)/2, Y=n=>H-pad-(n-n0)*sc-((H-2*pad)-(n1-n0)*sc)/2;
  const pl=(a,c,w,d)=>`<path d="${a.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+','+Y(p.n).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="${w}"${d?' stroke-dasharray="'+d+'"':''}/>`;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Planta del diseño">`;
  const top=G.niveles[0], bot=G.niveles[G.niveles.length-1];
  const outline=l=>{ const a=l.f, h=P.sls.largo/2; const c1={x:a.x-G.u.x*h,n:a.n-G.u.n*h}, c2={x:a.x+G.u.x*h,n:a.n+G.u.n*h}; const w={x:G.dipDir.x*G.Wh,n:G.dipDir.n*G.Wh}; return [c1,c2,{x:c2.x+w.x,n:c2.n+w.n},{x:c1.x+w.x,n:c1.n+w.n},c1]; };
  if(top) s+=pl(outline(top),'#d27a3f',1.5); if(bot&&bot!==top) s+=pl(outline(bot),'#d27a3f',1,'4 3');
  s+=pl(R,'#f0a26a',2);
  G.el.forEach(e=>{ if(e.tipo==='acceso') s+=pl([e.a,e.b],'#4fb59a',2); else if(e.tipo==='galeria'||e.tipo==='produccion') s+=pl([e.a,e.b],'#8fd3c0',1,'2 2');
    else if(e.tipo==='refugio') s+=`<rect x="${X(e.p.x)-3}" y="${Y(e.p.n)-3}" width="6" height="6" fill="#6ee7b7"><title>Zona de seguridad SN${e.nivel}</title></rect>`;
    else if(e.tipo==='ventilacion') s+=`<circle cx="${X(e.a.x)}" cy="${Y(e.a.n)}" r="5" fill="#7fb3e0"><title>Chimenea de ventilación</title></circle>`;
    else if(e.tipo==='traspaso') s+=pl([e.a,e.b],'#c9a227',3); });
  (P.obras||[]).forEach(o=>{ s+=`<circle cx="${X(+o.x)}" cy="${Y(+o.n)}" r="4" fill="none" stroke="#ebe6dd" stroke-width="1.5"><title>${esc(o.nombre)}</title></circle>`; });
  s+=`<circle cx="${X(R[0].x)}" cy="${Y(R[0].n)}" r="5" fill="#f0a26a"/><text x="${X(R[0].x)+8}" y="${Y(R[0].n)+4}" fill="#ebe6dd" font-size="11" font-family="IBM Plex Mono, monospace">Portal</text>`;
  const bar=50, bpx=bar*sc; s+=`<line x1="${W-pad-bpx}" x2="${W-pad}" y1="${H-8}" y2="${H-8}" stroke="#ebe6dd" stroke-width="2"/><text x="${W-pad-bpx/2}" y="${H-12}" fill="#8f9c9f" font-size="10" font-family="IBM Plex Mono, monospace" text-anchor="middle">${bar} m</text>`;
  s+=`<g transform="translate(${pad+10},${pad+14})"><path d="M0,-12 L5,4 L0,0 L-5,4 Z" fill="#d27a3f"/><text y="16" fill="#ebe6dd" font-size="10" text-anchor="middle" font-family="IBM Plex Mono, monospace">N</text></g>`;
  el.innerHTML=s+'</svg>';
}
function drawSection(el,G){
  const W=Math.max(320,el.clientWidth||600), half=P.sls.largo/2, zMax=G.niveles.length?G.niveles[G.niveles.length-1].z+10:100;
  const H=Math.round(Math.min(560,Math.max(260,W*0.7))), m={l:56,r:14,t:16,b:24};
  const X=t=>m.l+(t+half+12)/(P.sls.largo+24)*(W-m.l-m.r), Y=z=>m.t+z/zMax*(H-m.t-m.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Sección longitudinal">`;
  s+=`<rect x="${X(-half)}" y="${Y(0)}" width="${X(half)-X(-half)}" height="${Y(P.sls.techo)-Y(0)}" fill="#3a464b" opacity=".55"/><text x="${(X(-half)+X(half))/2}" y="${(Y(0)+Y(P.sls.techo))/2+4}" fill="#b8c4c6" font-size="11" text-anchor="middle" font-family="IBM Plex Mono, monospace">Pilar corona (${fmt(P.sls.techo)} m)</text>`;
  if(G.niveles.length>1) s+=`<rect x="${X(-half)}" y="${Y(P.sls.techo)}" width="${X(half)-X(-half)}" height="${Y(G.niveles[G.niveles.length-1].z)-Y(P.sls.techo)}" fill="#3a464b" opacity=".55"/>`;
  const rows=Math.max(1,G.niveles.length-1);
  G.caserones.forEach(c=>{ const a=-half+(c.i-1)*(P.sls.largoCaseron+P.sls.pilar), shade=0.55+0.45*(1-(c.fila-1)/rows);
    s+=`<rect x="${X(a)}" y="${Y(c.zTop)}" width="${X(a+P.sls.largoCaseron)-X(a)}" height="${Y(c.zBot)-Y(c.zTop)}" fill="#d27a3f" opacity="${shade.toFixed(2)}" stroke="#f0a26a" stroke-width=".6"><title>Caserón ${c.id}: ${fmt(c.tMin)} t a extraer · ley ${fmt(c.ley,2)} %</title></rect>`; });
  G.niveles.forEach(l=>{ s+=`<line x1="${X(-half-10)}" x2="${X(half+10)}" y1="${Y(l.z)}" y2="${Y(l.z)}" stroke="${l.reach?'#8fd3c0':'#e0564a'}" stroke-width="1.5"/><text x="${m.l-6}" y="${Y(l.z)+4}" fill="#8f9c9f" font-size="10" text-anchor="end" font-family="IBM Plex Mono, monospace">SN${l.k+1} −${fmt(l.z)}</text>`; });
  if(G.niveles.length>1){ const zb=G.niveles[G.niveles.length-1].z;
    s+=`<line x1="${X(half+8)}" x2="${X(half+8)}" y1="${Y(P.sls.techo)}" y2="${Y(zb)}" stroke="#c9a227" stroke-width="3"><title>Pique de traspaso</title></line>`;
    s+=`<line x1="${X(-half-8)}" x2="${X(-half-8)}" y1="${Y(0)}" y2="${Y(zb)}" stroke="#7fb3e0" stroke-width="3"><title>Chimenea de ventilación</title></line>`; }
  s+=`<line x1="${X(-half-12)}" x2="${X(half+12)}" y1="${Y(0)}" y2="${Y(0)}" stroke="#ebe6dd" stroke-dasharray="4 3"/><text x="${X(half+12)}" y="${Y(0)-4}" fill="#8f9c9f" font-size="10" text-anchor="end" font-family="IBM Plex Mono, monospace">cota del portal</text>`;
  s+=`<text x="${X(-half)}" y="${H-6}" fill="#8f9c9f" font-size="10" font-family="IBM Plex Mono, monospace">0 m</text><text x="${X(half)}" y="${H-6}" fill="#8f9c9f" font-size="10" text-anchor="end" font-family="IBM Plex Mono, monospace">${fmt(P.sls.largo)} m según rumbo ${fmt(G.q.rumbo,0)}°</text>`;
  el.innerHTML=s+'</svg>';
}

function pStats(p){
  const d=P.diseno, barra=+p.barra||d.barra, n=+p.disparos||1;
  const ancho=+p.ancho||d.ancho, alto=+p.alto||d.alto, area=ancho*alto, areaD=d.ancho*d.alto;

  const tt=['tPerf','tCarg','tVent','tAcu','tFort','tExtr'].reduce((s,k)=>s+(+p[k]||0),0);
  return {barra,n,m,ef:barra>0&&m>0?m/(barra*n):null,area,vol,t,kg,fc:vol>0&&kg>0?kg/vol:null,kgt:t>0&&kg>0?kg/t:null,
    sobre:(p.ancho||p.alto)?area/areaD-1:null,ciclo:tt>0?(tt+(+p.demora||0))/60:null,material:p.material||'mineral',perf:(+p.tiros||0)*barra,ley:p.ley!=null&&p.ley!==''?+p.ley:null};

  const tMin=S.filter(s=>s.material==='mineral').reduce((a,s)=>a+s.t,0);
  return {n:list.length, disparos:sum(s=>s.n), m:sum(s=>s.m), vol:sum(s=>s.vol), t:sum(s=>s.t), tMin, tEst:sum(s=>s.t)-tMin, kg:sum(s=>s.kg),
    ef:efD.length?efD.reduce((a,s)=>a+s.m,0)/efD.reduce((a,s)=>a+s.barra*s.n,0):null,
    fc:fcD.length?fcD.reduce((a,s)=>a+s.kg,0)/fcD.reduce((a,s)=>a+s.vol,0):null,

function stockExp(){
  const res={}; P.op.explosivos.productos.forEach(p=>res[p.id]=Object.assign({},p,{ing:0,cons:0,consP:0,cons14:0}));
  const lim=Date.now()-14*864e5;
  P.op.explosivos.movs.forEach(m=>{ const r=res[m.prod]; if(!r) return; if(m.tipo==='ingreso') r.ing+=+m.cant||0; else { r.cons+=+m.cant||0; if(new Date(m.fecha)>=lim) r.cons14+=+m.cant||0; } });
  P.operacion.avances.forEach(p=>{ const rec=new Date(p.fecha)>=lim; [['anfo','anfo'],['emul','emulsion'],['det','detonadores']].forEach(([id,k])=>{ if(res[id]){ res[id].consP+=+p[k]||0; if(rec) res[id].cons14+=+p[k]||0; } }); });
  Object.values(res).forEach(r=>{ r.saldo=r.ing-r.cons-r.consP; r.diario=r.cons14/14; r.dias=r.diario>0?r.saldo/r.diario:null; r.bajo=r.min!=null&&r.min!==''&&r.saldo<+r.min; r.valor=r.precio?(r.cons+r.consP)*r.precio:null; });

    const hor=Math.max(+e.horIni||0,...ps.map(x=>+x.horometro||0)); const mp=ps.filter(x=>x.tipoM==='preventiva').map(x=>+x.horometro||0);
    const lastMP=mp.length?Math.max(...mp):(+e.horIni||0); const prox=e.intervalo?lastMP+(+e.intervalo)-hor:null;
    return Object.assign({},e,{HP,HM,HO,L,df:HP>0?(HP-HM)/HP:null,ut:HP-HM>0?HO/(HP-HM):null,hor,prox,lph:HO>0?L/HO:null}); });

  let cMin=0,cDes=0; return [...months].filter(Boolean).sort().map(mo=>{

    const lo=P.operacion.lotes.filter(l=>ym(l.fecha)===mo), tms=lo.reduce((s,l)=>s+l.tmh*(1-(l.hum||0)/100),0), leyE=tms>0?lo.reduce((s,l)=>s+l.tmh*(1-(l.hum||0)/100)*(+l.ley||0),0)/tms:null;
    const mu=P.op.muestras.filter(m=>ym(m.fecha)===mo&&m.ley!=null), leyMu=mu.length?mu.reduce((s,m)=>s+(+m.ley),0)/mu.length:null;
    const leyM=a.ley!=null?a.ley:leyMu; cMin+=a.tMin; cDes+=tms;

}
/* Costos reales */
const CAT_GASTO=['Mano de obra','Explosivos','Combustible','Energía','Mantención y repuestos','Aceros de perforación','Fortificación','Transporte','Servicios','Otros'];
function costos(){
  const g=P.op.gastos, byCat={}; CAT_GASTO.forEach(c=>byCat[c]=0);
  g.forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+(+x.monto||0));
  const exp=stockExp().reduce((s,r)=>s+(r.valor||0),0), lit=P.op.partesEq.reduce((s,x)=>s+(+x.litros||0),0), comb=lit*(+P.op.precioDiesel||0);
  const auto={Explosivos:exp,Combustible:comb};
  const tot=Object.values(byCat).reduce((a,b)=>a+b,0)+exp+comb;
  const a=opAgg(P.operacion.avances); const sinMO=tot-(byCat['Mano de obra']||0);
  const tun=P.capex.find(i=>i.link==='mMin');
  return {byCat,auto,tot,m:a.m,tMin:a.tMin,cm:a.m>0?tot/a.m:null,cmSinMO:a.m>0?sinMO/a.m:null,ct:a.tMin>0?tot/a.tMin:null,ref:tun?+tun.pu:null,lit};
}

function fRead(form,fields){ const d={}; fields.forEach(f=>{ const v=form.elements[f.k].value; d[f.k]=(f.type||'number')==='number'?(v===''?null:+v):v; }); return d; }
